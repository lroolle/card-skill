ckens the lines of one card and fades the rest. The far card names the link, for example &quot;Option of 17&quot;.\u003c/li>\u003cli>Red already meant &quot;blocked&quot;, and a need is what blocks a card. Violet is new and has one meaning: an option.\u003c/li>\u003cli>A line starts and ends at the address line, where the numeral is.\u003c/li>\u003cli>On the section layout, a line between far columns crosses each column in a gap between cards, never behind a card.\u003c/li>\u003cli>Two links between the same two cards draw one line. The more specific link wins.\u003c/li>\u003c/ul>","options":[],"ask":null,"status":"open","basis":"fact","from":["opt-desk"],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":2,"rev":6,"at":"2026-10-09T08:38:35.548Z","title_html":"On the desk, a line means &quot;feeds into&quot;, and the far card names the link","gist_html":"\u003cp>Three links draw lines: \u003ccode>from=\u003c/code>, \u003ccode>needs=\u003c/code>, and the options of a decision. A mention draws a dashed line only for the card in focus. Focus turns the lines of that card blue. Each card at the far end names its link, for example &quot;Source of 8&quot;.\u003c/p>"},{"v":1,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"On the desk, a line means &quot;feeds into&quot;, and the far card names the link","gist_html":"\u003cp>Three links draw lines: \u003ccode>from=\u003c/code>, \u003ccode>needs=\u003c/code>, and the options of a decision. A mention draws a dotted line only for the card in focus. Focus turns the lines of that card blue. Each card at the far end names its link, for example &quot;Source of 8&quot;.\u003c/p>"}]},"desk-note":{"id":"desk-note","n":33,"v":2,"rev":10,"section":"the-desk-canvas","title_html":"You chat with the agent in a box in the bottom-right corner","title_text":"You chat with the agent in a box in the bottom-right corner","text":"You chat with the agent in a box in the bottom-right corner The note about the whole board is now a chat. Press c, write, and press Enter: the message goes now, as its own round. The agent answers with cards say, and the answer shows in the box. A yellow-red dot on the closed box means that the agent wrote. #+caption: The chat box: your messages on the right, the agent's on the left #+begin_src sketch ┌ The agent ───────── Your turn · Close ┐ │ ┌─────────────────────────┐ │ │ │ Also compare managed │ │ ◄ you: blue │ │ Kafka. Round 1 · read │ │ │ └─────────────────────────┘ │ │ ┌─────────────────────────┐ │ │ │ Got it: a card is next. │ │ ◄ the agent │ └─────────────────────────┘ │ │ The agent published rev 8 │ ◄ a revision ├───────────────────────────────────────┤ │ Message the agent [Send] │ └───────────────────────────────────────┘ #+end_src - Card answers still go together, with Send in the toolbar. A chat message goes alone and at once. - Esc in the first 5 seconds takes the message back into the box. - On a file page there is no server, so Send copies the message for you to paste. - The thread shows your rounds, the agent's messages and each revision that the agent published, in time order.","gist_html":"\u003cp>The note about the whole board is now a chat. Press \u003ccode>c\u003c/code>, write, and press Enter: the message goes now, as its own round. The agent answers with \u003ccode>cards say\u003c/code>, and the answer shows in the box. A yellow-red dot on the closed box means that the agent wrote.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"sketch\">\u003cdiv class=\"fig-body\">\u003cpre class=\"sketch\" role=\"img\" aria-label=\"Sketch: The chat box: your messages on the right, the agent&#39;s on the left\">┌ The agent ───────── Your turn · Close ┐\n│          ┌─────────────────────────┐  │\n│          │ Also compare managed    │  │ ◄ you: blue\n│          │ Kafka.   Round 1 · read │  │\n│          └─────────────────────────┘  │\n│ ┌─────────────────────────┐           │\n│ │ Got it: a card is next. │           │ ◄ the agent\n│ └─────────────────────────┘           │\n│      The agent published rev 8        │ ◄ a revision\n├───────────────────────────────────────┤\n│ Message the agent             [Send]  │\n└───────────────────────────────────────┘\u003c/pre>\u003c/div>\u003cfigcaption>\u003cb>Fig. 33.1\u003c/b> The chat box: your messages on the right, the agent&#39;s on the left\u003c/figcaption>\u003c/figure>","wide":true,"fig_w":413,"facts":[],"depth_html":"\u003cul>\u003cli>Card answers still go together, with Send in the toolbar. A chat message goes alone and at once.\u003c/li>\u003cli>Esc in the first 5 seconds takes the message back into the box.\u003c/li>\u003cli>On a file page there is no server, so Send copies the message for you to paste.\u003c/li>\u003cli>The thread shows your rounds, the agent&#39;s messages and each revision that the agent published, in time order.\u003c/li>\u003c/ul>","options":[],"ask":null,"status":"open","basis":"fact","from":[],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":1,"rev":7,"at":"2026-10-09T09:39:17.985Z","title_html":"The note to the agent is a dock in the bottom-left corner","gist_html":"\u003cp>The note about the whole board was a footer under the last section. It is now a dock that stays in reach in both views. Press \u003ccode>c\u003c/code> to open it. Esc closes it and keeps the draft. A blue dot shows a drafted note.\u003c/p>"}]},"ask-canvas":{"id":"ask-canvas","n":34,"v":4,"rev":11,"section":"the-desk-canvas","title_html":"The desk canvas is approved as built, with its five choices","title_text":"The desk canvas is approved as built, with its five choices","text":"The desk canvas is approved as built, with its five choices You approved it in round 2, and D17 records it. The five choices stay as built. 1. Fit, 50% and 100% replace 10%. 2. The top strip of a card is the drag handle. 3. Your layout stays in this browser. 4. A card that the agent adds goes to a new column at the right. 5. A phone opens on the rack.","gist_html":"\u003cp>You approved it in round 2, and D17 records it. The five choices stay as built.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"facts":[],"depth_html":"\u003col>\u003cli>Fit, 50% and 100% replace 10%.\u003c/li>\u003cli>The top strip of a card is the drag handle.\u003c/li>\u003cli>Your layout stays in this browser.\u003c/li>\u003cli>A card that the agent adds goes to a new column at the right.\u003c/li>\u003cli>A phone opens on the rack.\u003c/li>\u003c/ol>","options":[],"ask":null,"status":"done","basis":null,"from":["opt-desk","opt-free","desk-rules","desk-note"],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":3,"rev":9,"at":"2026-10-09T09:59:59.916Z","title_html":"Approve the desk canvas as built?","gist_html":"\u003cp>Five choices in the canvas are mine, not yours. Approve them all, or reject and reply with the number of the choice to change.\u003c/p>"},{"v":2,"rev":8,"at":"2026-10-09T09:59:52.003Z","title_html":"Approve the desk canvas as built?","gist_html":"\u003cp>Five choices here are mine, not yours. Fit, 50% and 100% replace 10%. The top strip is the drag handle. Your layout stays in this browser. New cards go to a column at the right. A phone opens on the rack. If you reject, reply with the choice to change.\u003c/p>"},{"v":1,"rev":7,"at":"2026-10-09T09:39:17.985Z","title_html":"Approve the desk canvas as built?","gist_html":"\u003cp>Four choices here are mine, not yours. Fit, 50% and 100% replace 10%. The top strip is the drag handle. Your layout stays in this browser. New cards go to a column at the right. If you reject, reply with the choice to change.\u003c/p>"}]},"org-format":{"id":"org-format","n":35,"v":1,"rev":7,"section":"org-the-board-format","title_html":"Boards are plain Org, with nothing invented on top of it","title_text":"Boards are plain Org, with nothing invented on top of it","text":"Boards are plain Org, with nothing invented on top of it A section is a * heading, and a card is a * heading. A property drawer holds the id and the links. The TODO keyword is the status. The markdown dialect needed its own {...} attributes; Org needs none. - card :: * The claim, then a :PROPERTIES: drawer (was ## The claim {#id}) - status :: the TODO keyword: DOING, BLOCKED, DONE (was status=done) - progress :: a cookie at the end of the claim, [3/8] (was progress=3/8) - facts :: a description list, - key :: value (was a facts fence) - figure :: #+caption:, then #+begin_src sketch or flow - link :: id (was id) The spec is skill/reference/format.md. The board reads correctly in Emacs, on GitHub, and in any editor. An older board.md still renders.","gist_html":"\u003cp>A section is a \u003ccode>*\u003c/code> heading, and a card is a \u003ccode>**\u003c/code> heading. A property drawer holds the id and the links. The TODO keyword is the status. The markdown dialect needed its own \u003ccode>{...}\u003c/code> attributes; Org needs none.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"facts":[["card","\u003ccode>** The claim\u003c/code>, then a \u003ccode>:PROPERTIES:\u003c/code> drawer (was \u003ccode>## The claim {#id}\u003c/code>)"],["status","the TODO keyword: \u003ccode>DOING\u003c/code>, \u003ccode>BLOCKED\u003c/code>, \u003ccode>DONE\u003c/code> (was \u003ccode>status=done\u003c/code>)"],["progress","a cookie at the end of the claim, \u003ccode>[3/8]\u003c/code> (was \u003ccode>progress=3/8\u003c/code>)"],["facts","a description list, \u003ccode>- key :: value\u003c/code> (was a facts fence)"],["figure","\u003ccode>#+caption:\u003c/code>, then \u003ccode>#+begin_src sketch\u003c/code> or \u003ccode>flow\u003c/code>"],["link","\u003ccode>[[#id]]\u003c/code> (was \u003ccode>[[id]]\u003c/code>)"]],"depth_html":"\u003cp>The spec is \u003ccode>skill/reference/format.md\u003c/code>. The board reads correctly in Emacs, on GitHub, and in any editor. An older \u003ccode>board.md\u003c/code> still renders.\u003c/p>","options":[],"ask":null,"status":"open","basis":"fact","from":[],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[]},"org-meaning":{"id":"org-meaning","n":36,"v":1,"rev":7,"section":"org-the-board-format","title_html":"Converting a board to Org is not a revision; a change in meaning is","title_text":"Converting a board to Org is not a revision; a change in meaning is","text":"Converting a board to Org is not a revision; a change in meaning is The compiler compares what a card means: its claim, its links, and its rendered body. This board went from markdown to Org, and the cards that did not change kept their versions. A re-wrapped paragraph is not a new version either. #+caption: What decides a new version #+begin_src flow card in board.md -> meaning: parse, render card in board.org -> meaning: parse, render meaning -> same version: equal meaning --> new version: different #+end_src","gist_html":"\u003cp>The compiler compares what a card means: its claim, its links, and its rendered body. This board went from markdown to Org, and the cards that did not change kept their versions. A re-wrapped paragraph is not a new version either.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"flow\">\u003cdiv class=\"fig-body\">\u003csvg class=\"flow\" viewBox=\"-25.1 -2 346 164\" width=\"346\" height=\"164\" role=\"img\" aria-label=\"Diagram: What decides a new version. card in board.md to meaning (parse, render); card in board.org to meaning (parse, render); meaning to same version (equal); meaning to new version (different)\">\u003cg class=\"fe\" data-a=\"0\" data-b=\"1\">\u003cpath d=\"M68,28 C68,47 140.8,47 140.8,66 M136.8,60 L140.8,66 L144.8,60\"/>\u003ctext x=\"70.5\" y=\"42.6\" text-anchor=\"end\" dominant-baseline=\"central\">parse, render\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"2\" data-b=\"1\">\u003cpath d=\"M227.5,28 C227.5,47 154.8,47 154.8,66 M150.8,60 L154.8,66 L158.8,60\"/>\u003ctext x=\"225\" y=\"42.6\" text-anchor=\"start\" dominant-baseline=\"central\">parse, render\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"1\" data-b=\"3\">\u003cpath d=\"M140.8,94 C140.8,113 86,113 86,132 M82,126 L86,132 L90,126\"/>\u003ctext x=\"83.4\" y=\"117.4\" text-anchor=\"end\" dominant-baseline=\"central\">equal\u003c/text>\u003c/g>\u003cg class=\"fe dash\" data-a=\"1\" data-b=\"4\">\u003cpath d=\"M154.8,94 C154.8,113 209.5,113 209.5,132 M205.5,126 L209.5,132 L213.5,126\"/>\u003ctext x=\"212.1\" y=\"117.4\" text-anchor=\"start\" dominant-baseline=\"central\">different\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"0\">\u003crect x=\"0\" y=\"0\" width=\"136\" height=\"28\" rx=\"3\"/>\u003ctext x=\"68\" y=\"14\" text-anchor=\"middle\" dominant-baseline=\"central\">card in board.md\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"1\">\u003crect x=\"112.3\" y=\"66\" width=\"71\" height=\"28\" rx=\"3\"/>\u003ctext x=\"147.8\" y=\"80\" text-anchor=\"middle\" dominant-baseline=\"central\">meaning\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"2\">\u003crect x=\"156\" y=\"0\" width=\"143\" height=\"28\" rx=\"3\"/>\u003ctext x=\"227.5\" y=\"14\" text-anchor=\"middle\" dominant-baseline=\"central\">card in board.org\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"3\">\u003crect x=\"32.5\" y=\"132\" width=\"107\" height=\"28\" rx=\"3\"/>\u003ctext x=\"86\" y=\"146\" text-anchor=\"middle\" dominant-baseline=\"central\">same version\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"4\">\u003crect x=\"159.5\" y=\"132\" width=\"100\" height=\"28\" rx=\"3\"/>\u003ctext x=\"209.5\" y=\"146\" text-anchor=\"middle\" dominant-baseline=\"central\">new version\u003c/text>\u003c/g>\u003c/svg>\u003c/div>\u003cfigcaption>\u003cb>Fig. 36.1\u003c/b> What decides a new version\u003c/figcaption>\u003c/figure>","wide":true,"fig_w":370,"facts":[],"depth_html":"","options":[],"ask":null,"status":"open","basis":"fact","from":["org-format"],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[]},"rethink-lines":{"id":"rethink-lines","n":22,"v":1,"rev":5,"section":"links-why-lines-came-back","title_html":"The old proposal hid every line, so you could not see the structure","title_text":"The old proposal hid every line, so you could not see the structure","text":"The old proposal hid every line, so you could not see the structure We rejected a canvas for one reason: a person remembers a layout only when they place the cards. Here the agent places the cards. That reason is about memory, not about structure. With no lines, you see the links of one card at a time. #+caption: Rack, card 6 in focus: you see the links of card 6 only #+begin_src sketch ┌─ 5 ────────────┐ ┌─ 6 ────────────┐ ┌─ 7 ────────────┐ │ (dimmed) │ │ IN FOCUS │ │ Source of 6 │ │ │ │ Sources: 7 │ │ │ └────────────────┘ └────────────────┘ └────────────────┘ ┌─ 8 ────────────┐ ┌─ 9 ────────────┐ ┌─ 10 ───────────┐ │ (dimmed) │ │ Decides 6 │ │ (dimmed) │ │ links to 5 and │ │ │ │ needs 8 │ │ 10: not shown │ │ │ │ not shown │ └────────────────┘ └────────────────┘ └────────────────┘ #+end_src | The reason we gave | What it missed | |---+---| | A canvas helps only when the human places the cards. | A canvas also shows the structure. A layout by rule gives that, and nobody places a card. | | Lines tangle past about 30 cards. | A board has 30 cards at most, and cards check warns past that. Only three link types draw lines. | | Builders of canvases report \"paper cuts\" and mess. | Those canvases had free placement. A layout by rule has no placement to keep tidy. | | An AI re-layout breaks your memory of the layout. | A layout by rule changes only when the board changes. Changed cards show \"Changed\". | | Focus light still works at 200 cards. | Focus shows one card at a time. Our research named that cost: \"there is no overview\" (model C in docs/research/connected-cards-prior-art.md). |","gist_html":"\u003cp>We rejected a canvas for one reason: a person remembers a layout only when they place the cards. Here the agent places the cards. That reason is about memory, not about structure. With no lines, you see the links of one card at a time.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"sketch\">\u003cdiv class=\"fig-body\">\u003cpre class=\"sketch\" role=\"img\" aria-label=\"Sketch: Rack, card 6 in focus: you see the links of card 6 only\">┌─ 5 ────────────┐  ┌─ 6 ────────────┐  ┌─ 7 ────────────┐\n│ (dimmed)       │  │ IN FOCUS       │  │ Source of 6    │\n│                │  │ Sources: 7     │  │                │\n└────────────────┘  └────────────────┘  └────────────────┘\n┌─ 8 ────────────┐  ┌─ 9 ────────────┐  ┌─ 10 ───────────┐\n│ (dimmed)       │  │ Decides 6      │  │ (dimmed)       │\n│ links to 5 and │  │                │  │ needs 8        │\n│ 10: not shown  │  │                │  │ not shown      │\n└────────────────┘  └────────────────┘  └────────────────┘\u003c/pre>\u003c/div>\u003cfigcaption>\u003cb>Fig. 22.1\u003c/b> Rack, card 6 in focus: you see the links of card 6 only\u003c/figcaption>\u003c/figure>","wide":true,"fig_w":442,"facts":[],"depth_html":"\u003cdiv class=\"table\">\u003ctable>\u003cthead>\u003ctr>\u003cth>The reason we gave\u003c/th>\u003cth>What it missed\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>A canvas helps only when the human places the cards.\u003c/td>\u003ctd>A canvas also shows the structure. A layout by rule gives that, and nobody places a card.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Lines tangle past about 30 cards.\u003c/td>\u003ctd>A board has 30 cards at most, and \u003ccode>cards check\u003c/code> warns past that. Only three link types draw lines.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Builders of canvases report &quot;paper cuts&quot; and mess.\u003c/td>\u003ctd>Those canvases had free placement. A layout by rule has no placement to keep tidy.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>An AI re-layout breaks your memory of the layout.\u003c/td>\u003ctd>A layout by rule changes only when the board changes. Changed cards show &quot;Changed&quot;.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Focus light still works at 200 cards.\u003c/td>\u003ctd>Focus shows one card at a time. Our research named that cost: &quot;there is no overview&quot; (model C in \u003ccode>docs/research/connected-cards-prior-art.md\u003c/code>).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","options":[],"ask":null,"status":"open","basis":"inference","from":[],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[]},"luhmann":{"id":"luhmann","n":23,"v":2,"rev":7,"section":"links-why-lines-came-back","title_html":"Luhmann never moved a card: he took cards out to use them and put each one back","title_text":"Luhmann never moved a card: he took cards out to use them and put each one back","text":"Luhmann never moved a card: he took cards out to use them and put each one back Each card had a fixed address, because finding a card depended on it. A card in the wrong place got a link, not a new place. He took a card out to use it and put it back in the same place. We found no source that he spread cards on a desk to write. #+caption: The box keeps each card at its address; work uses a few cards #+begin_src sketch THE BOX: one fixed address for each card ┌───────┬────────┬─────────┬───────┐ │ 57/12 │ 57/12a │ 57/12a1 │ 57/13 │ ... 21/3d └───────┴─┬────▲─┴─────────┴───────┘ │ │ take out │ │ put back, same place ▼ │ THE WORK: a few cards at a time ┌────────┐ ┌───────┐ │ 57/12a │ │ 21/3d │ far link on 57/12a: \"21/3d\" └────────┘ └───────┘ #+end_src - cards :: about 90,000, in two collections - address :: fixed; 57/12 goes on as 57/13 or branches as 57/12a - wrong place :: fixed by a link, never by a move - far links :: about 50,000, written by hand on the cards - way in :: a short index, 1 to 4 cards for each keyword What this means for the board: - The rack is the box. Each card keeps one numeral and one place in board.org. - The desk is the work. It shows the same cards and moves none of them in board.org. - His far links are our from=, needs= and id. He walked them by hand. The desk draws them. - His editors drew an arc diagram of the links in one drawer to see where links are dense. The arcs in a desk column are the same kind of drawing. The picture of Luhmann with cards spread across a desk is not in the sources we read. The closest source is his 1968 rule: \"take it out when you use it, and put it back in exactly the same place\". A 1987 interview, through Johannes Schmidt, calls his writing for one talk \"a kind of collaging technique\". So the desk is our design, not his method. The 1987 interview itself is unread. Sources and quotes are in docs/research/luhmann-zettelkasten.md.","gist_html":"\u003cp>Each card had a fixed address, because finding a card depended on it. A card in the wrong place got a link, not a new place. He took a card out to use it and put it back in the same place. We found no source that he spread cards on a desk to write.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"sketch\">\u003cdiv class=\"fig-body\">\u003cpre class=\"sketch\" role=\"img\" aria-label=\"Sketch: The box keeps each card at its address; work uses a few cards\">THE BOX: one fixed address for each card\n┌───────┬────────┬─────────┬───────┐\n│ 57/12 │ 57/12a │ 57/12a1 │ 57/13 │  ...  21/3d\n└───────┴─┬────▲─┴─────────┴───────┘\n          │    │\n take out │    │ put back, same place\n          ▼    │\nTHE WORK: a few cards at a time\n┌────────┐  ┌───────┐\n│ 57/12a │  │ 21/3d │   far link on 57/12a: &quot;21/3d&quot;\n└────────┘  └───────┘\u003c/pre>\u003c/div>\u003cfigcaption>\u003cb>Fig. 23.1\u003c/b> The box keeps each card at its address; work uses a few cards\u003c/figcaption>\u003c/figure>","wide":true,"fig_w":392,"facts":[["cards","about 90,000, in two collections"],["address","fixed; 57/12 goes on as 57/13 or branches as 57/12a"],["wrong place","fixed by a link, never by a move"],["far links","about 50,000, written by hand on the cards"],["way in","a short index, 1 to 4 cards for each keyword"]],"depth_html":"\u003cp>What this means for the board:\u003c/p>\u003cul>\u003cli>The rack is the box. Each card keeps one numeral and one place in board.org.\u003c/li>\u003cli>The desk is the work. It shows the same cards and moves none of them in board.org.\u003c/li>\u003cli>His far links are our \u003ccode>from=\u003c/code>, \u003ccode>needs=\u003c/code> and \u003ccode>[[id]]\u003c/code>. He walked them by hand. The desk draws them.\u003c/li>\u003cli>His editors drew an arc diagram of the links in one drawer to see where links are dense. The arcs in a desk column are the same kind of drawing.\u003c/li>\u003c/ul>\u003cp>The picture of Luhmann with cards spread across a desk is not in the sources we read. The closest source is his 1968 rule: &quot;take it out when you use it, and put it back in exactly the same place&quot;. A 1987 interview, through Johannes Schmidt, calls his writing for one talk &quot;a kind of collaging technique&quot;. So the desk is our design, not his method. The 1987 interview itself is unread. Sources and quotes are in \u003ccode>docs/research/luhmann-zettelkasten.md\u003c/code>.\u003c/p>","options":[],"ask":null,"status":"open","basis":"fact","from":[],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":1,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"Luhmann never moved a card: he took cards out to use them and put each one back","gist_html":"\u003cp>Each card had a fixed address, because finding a card depended on it. A card in the wrong place got a link, not a new place. He took a card out to use it and put it back in the same place. We found no source that he spread cards on a desk to write.\u003c/p>"}]},"ask-connection":{"id":"ask-connection","n":17,"v":3,"rev":7,"section":"links-why-lines-came-back","title_html":"The board opens on the desk; the rack is one key away","title_text":"The board opens on the desk; the rack is one key away","text":"The board opens on the desk; the rack is one key away You chose this in round 1: the rack and the desk, with the board opening on the desk. D15 records it. The desk now also zooms, and you can place the cards yourself: see opt-desk and opt-free.","gist_html":"\u003cp>You chose this in round 1: the rack and the desk, with the board opening on the desk. D15 records it. The desk now also zooms, and you can place the cards yourself: see \u003ca class=\"ref\" href=\"#c-opt-desk\" data-ref=\"opt-desk\">\u003cspan class=\"ref-n\">25\u003c/span>\u003cspan class=\"ref-t\">The board opens on the desk, zoomed to fit the whole board\u003c/span>\u003c/a> and \u003ca class=\"ref\" href=\"#c-opt-free\" data-ref=\"opt-free\">\u003cspan class=\"ref-n\">26\u003c/span>\u003cspan class=\"ref-t\">Drag a card by its top strip to place it; Arrange puts every card back\u003c/span>\u003c/a>.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"facts":[],"depth_html":"","options":[],"ask":null,"status":"done","basis":null,"from":["rethink-lines"],"needs":[],"when":{},"refs":["opt-desk","opt-free"],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":2,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"Which view do we keep for links?","gist_html":"\u003cp>The rack stays for reading and answering in every option. The question is how you see the links. I recommend the rack and the desk, with the board opening on the rack.\u003c/p>"},{"v":1,"rev":1,"at":"2026-10-09T05:19:58.566Z","title_html":"Keep the connection model: sections, numerals and focus light, with no edges?","gist_html":"\u003cp>This is the biggest bet. A spatial canvas is the main alternative. The research says a canvas costs arranging time and tangles past 30 cards.\u003c/p>"}]},"show-first":{"id":"show-first","n":28,"v":2,"rev":6,"section":"figures-show-then-tell","title_html":"A card shows the shape it talks about, and the text names it","title_text":"A card shows the shape it talks about, and the text names it","text":"A card shows the shape it talks about, and the text names it When a claim is about a layout, a flow or a structure, the card carries a figure. A decision about a view shows each option as a sketch. The first figure shows at the Gist level, under the gist. #+caption: Card anatomy: what shows at each level #+begin_src sketch ┌ Choose ┐ ◄ tab: an ask waits on you ┌┴────────┴────────────────────┐ │ 12 Inference v2 │ ◄ numeral and basis │ The claim, in one sentence │ ◄ Claim level │ The gist, in one paragraph │ ◄ Gist level │ ┌──────────────────────────┐ │ │ │ figure │ │ ◄ Gist level, Fig. 12.1 │ └──────────────────────────┘ │ │ facts and options │ ◄ Gist level │ depth: reasons, sources │ ◄ Full level └──────────────────────────────┘ #+end_src Figures have numbers, like card numerals: Fig. 12.1 is the first figure on card 12. You can point at a figure in words.","gist_html":"\u003cp>When a claim is about a layout, a flow or a structure, the card carries a figure. A decision about a view shows each option as a sketch. The first figure shows at the Gist level, under the gist.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"sketch\">\u003cdiv class=\"fig-body\">\u003cpre class=\"sketch\" role=\"img\" aria-label=\"Sketch: Card anatomy: what shows at each level\"> ┌ Choose ┐                       ◄ tab: an ask waits on you\n┌┴────────┴────────────────────┐\n│ 12  Inference  v2            │  ◄ numeral and basis\n│ The claim, in one sentence   │  ◄ Claim level\n│ The gist, in one paragraph   │  ◄ Gist level\n│ ┌──────────────────────────┐ │\n│ │ figure                   │ │  ◄ Gist level, Fig. 12.1\n│ └──────────────────────────┘ │\n│ facts and options            │  ◄ Gist level\n│ depth: reasons, sources      │  ◄ Full level\n└──────────────────────────────┘\u003c/pre>\u003c/div>\u003cfigcaption>\u003cb>Fig. 28.1\u003c/b> Card anatomy: what shows at each level\u003c/figcaption>\u003c/figure>","wide":true,"fig_w":456,"facts":[],"depth_html":"\u003cp>Figures have numbers, like card numerals: Fig. 12.1 is the first figure on card 12. You can point at a figure in words.\u003c/p>","options":[],"ask":null,"status":"open","basis":"fact","from":[],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":1,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"A card shows the shape it talks about, and the text names it","gist_html":"\u003cp>When a claim is about a layout, a flow or a structure, the card carries a figure. A decision about a view shows each option as a sketch. The first figure shows at the Gist level, under the gist.\u003c/p>"}]},"fig-sketch":{"id":"fig-sketch","n":29,"v":2,"rev":7,"section":"figures-show-then-tell","title_html":"A sketch block draws a layout in text characters","title_text":"A sketch block draws a layout in text characters","text":"A sketch block draws a layout in text characters Write a sketch with box characters, as in a terminal. The page shows it as written, in one ink, with a numbered caption. An agent writes it at low cost, and it reads the same in board.org, in a diff and in the terminal. #+caption: A wide figure makes its card two columns wide on the rack #+begin_src sketch ┌─────────────────────────┐ ┌───────────┐ │ card with a wide figure │ │ card │ │ ┌─────────────────────┐ │ │ │ │ │ figure, 50 columns │ │ │ │ │ └─────────────────────┘ │ │ │ └─────────────────────────┘ └───────────┘ ┌───────────┐ ┌───────────┐ ┌───────────┐ │ card │ │ card │ │ card │ └───────────┘ └───────────┘ └───────────┘ #+end_src The source of a sketch: #+begin_example #+caption: What the figure shows, in a few words #+begin_src sketch ┌────┐ ┌────┐ │ A ├──►│ B │ └────┘ └────┘ #+end_src #+end_example - A sketch is 72 columns wide at most. A wide sketch makes its card two columns wide on the rack. - Chinese and Japanese characters do not keep the columns. Use Latin labels in a sketch. - A sketch has no colors and no markup. It shows in the ink of the card.","gist_html":"\u003cp>Write a sketch with box characters, as in a terminal. The page shows it as written, in one ink, with a numbered caption. An agent writes it at low cost, and it reads the same in board.org, in a diff and in the terminal.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"sketch\">\u003cdiv class=\"fig-body\">\u003cpre class=\"sketch\" role=\"img\" aria-label=\"Sketch: A wide figure makes its card two columns wide on the rack\">┌─────────────────────────┐ ┌───────────┐\n│ card with a wide figure │ │ card      │\n│ ┌─────────────────────┐ │ │           │\n│ │ figure, 50 columns  │ │ │           │\n│ └─────────────────────┘ │ │           │\n└─────────────────────────┘ └───────────┘\n┌───────────┐ ┌───────────┐ ┌───────────┐\n│ card      │ │ card      │ │ card      │\n└───────────┘ └───────────┘ └───────────┘\u003c/pre>\u003c/div>\u003cfigcaption>\u003cb>Fig. 29.1\u003c/b> A wide figure makes its card two columns wide on the rack\u003c/figcaption>\u003c/figure>","wide":false,"fig_w":320,"facts":[],"depth_html":"\u003cp>The source of a sketch:\u003c/p>\u003cpre>\u003ccode>#+caption: What the figure shows, in a few words\n#+begin_src sketch\n  ┌────┐   ┌────┐\n  │ A  ├──►│ B  │\n  └────┘   └────┘\n#+end_src\u003c/code>\u003c/pre>\u003cul>\u003cli>A sketch is 72 columns wide at most. A wide sketch makes its card two columns wide on the rack.\u003c/li>\u003cli>Chinese and Japanese characters do not keep the columns. Use Latin labels in a sketch.\u003c/li>\u003cli>A sketch has no colors and no markup. It shows in the ink of the card.\u003c/li>\u003c/ul>","options":[],"ask":null,"status":"open","basis":"fact","from":["show-first"],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":1,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"A sketch block draws a layout in text characters","gist_html":"\u003cp>Write a sketch with box characters, as in a terminal. The page shows it as written, in one ink, with a numbered caption. An agent writes it at low cost, and it reads the same in board.md, in a diff and in the terminal.\u003c/p>"}]},"fig-flow":{"id":"fig-flow","n":30,"v":2,"rev":7,"section":"figures-show-then-tell","title_html":"A flow block draws boxes and arrows, and the compiler places them","title_text":"A flow block draws boxes and arrows, and the compiler places them","text":"A flow block draws boxes and arrows, and the compiler places them Write one arrow on each line, such as a -> b: label. The compiler puts the boxes in ranks, orders them to cut crossings, and draws the arrows. The agent never places a box, so the same text always gives the same picture. #+caption: The card-skill loop #+begin_src flow board.org -> cards render: agent writes cards render -> board.html board.html -> you: open you -> log.jsonl: Send log.jsonl -> agent: cards wait agent -> board.org: revise #+end_src - a -> b is an arrow. a --> b is a dashed arrow, for a later or optional step. - a -> b: label puts a label on the arrow. a -> b -> c is a chain. - a makes a bold box, for the part under discussion. - direction: right draws left to right. The default is down. - A flow has 12 boxes at most. Point at a box to darken its arrows.","gist_html":"\u003cp>Write one arrow on each line, such as \u003ccode>a -&gt; b: label\u003c/code>. The compiler puts the boxes in ranks, orders them to cut crossings, and draws the arrows. The agent never places a box, so the same text always gives the same picture.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"flow\">\u003cdiv class=\"fig-body\">\u003csvg class=\"flow\" viewBox=\"-2 -2 223 354\" width=\"223\" height=\"354\" role=\"img\" aria-label=\"Diagram: The card-skill loop. board.org to cards render (agent writes); cards render to board.html; board.html to you (open); you to log.jsonl (Send); log.jsonl to agent (cards wait); agent to board.org (revise)\">\u003cg class=\"fe\" data-a=\"0\" data-b=\"1\">\u003cpath d=\"M53.5,28 C53.5,47 53.5,47 53.5,66 M49.5,60 L53.5,66 L57.5,60\"/>\u003ctext x=\"60.5\" y=\"42.6\" text-anchor=\"start\" dominant-baseline=\"central\">agent writes\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"1\" data-b=\"2\">\u003cpath d=\"M53.5,94 C53.5,109 53.5,109 53.5,124 M49.5,118 L53.5,124 L57.5,118\"/>\u003c/g>\u003cg class=\"fe\" data-a=\"2\" data-b=\"3\">\u003cpath d=\"M53.5,152 C53.5,171 53.5,171 53.5,190 M49.5,184 L53.5,190 L57.5,184\"/>\u003ctext x=\"60.5\" y=\"166.6\" text-anchor=\"start\" dominant-baseline=\"central\">open\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"3\" data-b=\"4\">\u003cpath d=\"M53.5,218 C53.5,237 53.5,237 53.5,256 M49.5,250 L53.5,256 L57.5,250\"/>\u003ctext x=\"60.5\" y=\"232.6\" text-anchor=\"start\" dominant-baseline=\"central\">Send\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"4\" data-b=\"5\">\u003cpath d=\"M53.5,284 C53.5,303 53.5,303 53.5,322 M49.5,316 L53.5,322 L57.5,316\"/>\u003ctext x=\"60.5\" y=\"298.6\" text-anchor=\"start\" dominant-baseline=\"central\">cards wait\u003c/text>\u003c/g>\u003cg class=\"fe back\" data-a=\"5\" data-b=\"0\">\u003cpath d=\"M81.5,336 L161.9,336 Q167.9,336 167.9,330 L167.9,20 Q167.9,14 161.9,14 L96,14 M102,10 L96,14 L102,18\"/>\u003ctext x=\"174.9\" y=\"175\" text-anchor=\"start\" dominant-baseline=\"central\">revise\u003c/text>\u003c/g>\u003cg class=\"fn strong\" data-n=\"0\">\u003crect x=\"11\" y=\"0\" width=\"85\" height=\"28\" rx=\"3\"/>\u003ctext x=\"53.5\" y=\"14\" text-anchor=\"middle\" dominant-baseline=\"central\">board.org\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"1\">\u003crect x=\"0\" y=\"66\" width=\"107\" height=\"28\" rx=\"3\"/>\u003ctext x=\"53.5\" y=\"80\" text-anchor=\"middle\" dominant-baseline=\"central\">cards render\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"2\">\u003crect x=\"7.5\" y=\"124\" width=\"92\" height=\"28\" rx=\"3\"/>\u003ctext x=\"53.5\" y=\"138\" text-anchor=\"middle\" dominant-baseline=\"central\">board.html\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"3\">\u003crect x=\"29.5\" y=\"190\" width=\"48\" height=\"28\" rx=\"3\"/>\u003ctext x=\"53.5\" y=\"204\" text-anchor=\"middle\" dominant-baseline=\"central\">you\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"4\">\u003crect x=\"11\" y=\"256\" width=\"85\" height=\"28\" rx=\"3\"/>\u003ctext x=\"53.5\" y=\"270\" text-anchor=\"middle\" dominant-baseline=\"central\">log.jsonl\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"5\">\u003crect x=\"25.5\" y=\"322\" width=\"56\" height=\"28\" rx=\"3\"/>\u003ctext x=\"53.5\" y=\"336\" text-anchor=\"middle\" dominant-baseline=\"central\">agent\u003c/text>\u003c/g>\u003c/svg>\u003c/div>\u003cfigcaption>\u003cb>Fig. 30.1\u003c/b> The card-skill loop\u003c/figcaption>\u003c/figure>","wide":false,"fig_w":247,"facts":[],"depth_html":"\u003cul>\u003cli>\u003ccode>a -&gt; b\u003c/code> is an arrow. \u003ccode>a --&gt; b\u003c/code> is a dashed arrow, for a later or optional step.\u003c/li>\u003cli>\u003ccode>a -&gt; b: label\u003c/code> puts a label on the arrow. \u003ccode>a -&gt; b -&gt; c\u003c/code> is a chain.\u003c/li>\u003cli>\u003ccode>*a*\u003c/code> makes a bold box, for the part under discussion.\u003c/li>\u003cli>\u003ccode>direction: right\u003c/code> draws left to right. The default is down.\u003c/li>\u003cli>A flow has 12 boxes at most. Point at a box to darken its arrows.\u003c/li>\u003c/ul>","options":[],"ask":null,"status":"open","basis":"fact","from":["show-first"],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":1,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"A flow block draws boxes and arrows, and the compiler places them","gist_html":"\u003cp>Write one arrow on each line, such as \u003ccode>a -&gt; b: label\u003c/code>. The compiler puts the boxes in ranks, orders them to cut crossings, and draws the arrows. The agent never places a box, so the same text always gives the same picture.\u003c/p>"}]},"ste80":{"id":"ste80","n":31,"v":1,"rev":5,"section":"writing-near-asd-ste100","title_html":"Cards follow ASD-STE100, about 80% of the way","title_text":"Cards follow ASD-STE100, about 80% of the way","text":"Cards follow ASD-STE100, about 80% of the way Karpathy suggests ASD-STE100 to make model output easier to read. We take the rules that a checker can test, and the writer keeps the rest. Write one fact in each sentence. Use active verbs in the present tense. Use the same word for the same thing. - before :: The server binds to loopback only, requires a per-run token and this server's Origin on every write, allows only its own Host names, takes board ids as slugs and never as paths, and checks every reply item by kind. (39 words) - after :: The server listens on this machine only. - :: Every write needs the page token and this Origin. - :: The server accepts only its own Host names. - :: A board id is a short name, never a path. - :: The server checks each reply item by its kind. - sentence :: 25 words at most; 20 for an instruction - paragraph :: 6 sentences at most, one topic - words :: the STE sheet list, and words that agents overuse - checked by :: cards check, as warnings The rules come from the ASD-STE100 sheet on Karpathy's post (https://x.com/karpathy/status/2105819303471976479). The full profile is in skill/reference/writing.md.","gist_html":"\u003cp>Karpathy suggests ASD-STE100 to make model output easier to read. We take the rules that a checker can test, and the writer keeps the rest. Write one fact in each sentence. Use active verbs in the present tense. Use the same word for the same thing.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"facts":[["before","The server binds to loopback only, requires a per-run token and this server&#39;s Origin on every write, allows only its own Host names, takes board ids as slugs and never as paths, and checks every reply item by kind. (39 words)"],["after","The server listens on this machine only."],["","Every write needs the page token and this Origin."],["","The server accepts only its own Host names."],["","A board id is a short name, never a path."],["","The server checks each reply item by its kind."],["sentence","25 words at most; 20 for an instruction"],["paragraph","6 sentences at most, one topic"],["words","the STE sheet list, and words that agents overuse"],["checked by","cards check, as warnings"]],"depth_html":"\u003cp>The rules come from the ASD-STE100 sheet on Karpathy&#39;s post (\u003ca href=\"https://x.com/karpathy/status/2105819303471976479\" target=\"_blank\" rel=\"noopener noreferrer\">https://x.com/karpathy/status/2105819303471976479\u003c/a>). The full profile is in \u003ccode>skill/reference/writing.md\u003c/code>.\u003c/p>","options":[],"ask":null,"status":"open","basis":"fact","from":[],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[]},"ste-lint":{"id":"ste-lint","n":32,"v":2,"rev":7,"section":"writing-near-asd-ste100","title_html":"The checker warns on long sentences and on listed words","title_text":"The checker warns on long sentences and on listed words","text":"The checker warns on long sentences and on listed words cards check and cards render count the words in each sentence and the sentences in each paragraph. They flag words such as \"utilize\" and \"leverage\", and they give the plain word. Quotes and code do not count. A board in another language skips these checks. What the agent sees after cards render: #+begin_src text board.org:56 warn: sentence has 28 words; split it (\u003c= 25) board.org:61 warn: \"utilize\": write use (writing.md word list) ok: 24 cards, 9 sections, 2 warnings #+end_src Some rules need a person, not a checker: active voice, short noun groups, and one meaning for each word. They are in the profile as rules for the writer.","gist_html":"\u003cp>\u003ccode>cards check\u003c/code> and \u003ccode>cards render\u003c/code> count the words in each sentence and the sentences in each paragraph. They flag words such as &quot;utilize&quot; and &quot;leverage&quot;, and they give the plain word. Quotes and code do not count. A board in another language skips these checks.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"facts":[],"depth_html":"\u003cp>What the agent sees after \u003ccode>cards render\u003c/code>:\u003c/p>\u003cpre data-lang=\"text\">\u003ccode>board.org:56  warn: sentence has 28 words; split it (&lt;= 25)\nboard.org:61  warn: &quot;utilize&quot;: write use (writing.md word list)\nok: 24 cards, 9 sections, 2 warnings\u003c/code>\u003c/pre>\u003cp>Some rules need a person, not a checker: active voice, short noun groups, and one meaning for each word. They are in the profile as rules for the writer.\u003c/p>","options":[],"ask":null,"status":"open","basis":"fact","from":["ste80"],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":1,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"The checker warns on long sentences and on listed words","gist_html":"\u003cp>\u003ccode>cards check\u003c/code> and \u003ccode>cards render\u003c/code> count the words in each sentence and the sentences in each paragraph. They flag words such as &quot;utilize&quot; and &quot;leverage&quot;, and they give the plain word. Quotes and code do not count. A board in another language skips these checks.\u003c/p>"}]},"return-channel":{"id":"return-channel","n":11,"v":3,"rev":5,"section":"replies-the-return-path","title_html":"Your replies reach the agent as files, or by copy and paste","title_text":"Your replies reach the agent as files, or by copy and paste","text":"Your replies reach the agent as files, or by copy and paste With cards serve, Send writes your reply to log.jsonl, and the agent reads it with cards wait. Without a server, Send copies the same text, and you paste it into the chat. An ask that you do not touch is reported as untouched. It is never consent. #+caption: Two paths back to the agent #+begin_src flow Send -> cards serve: served page cards serve -> log.jsonl log.jsonl -> agent: cards wait Send -> clipboard: file page clipboard -> chat: you paste chat -> agent #+end_src - The server listens on this machine only. - Every write needs the page token and the Origin of this server. - The server accepts only its own Host names. - A board id is a short name, never a path. - The server checks each reply item by its kind. A code review found three holes in the first version. Each fix has a test in test/review.test.mjs. In this container, your browser cannot reach the server. Use the file page and Copy.","gist_html":"\u003cp>With \u003ccode>cards serve\u003c/code>, Send writes your reply to \u003ccode>log.jsonl\u003c/code>, and the agent reads it with \u003ccode>cards wait\u003c/code>. Without a server, Send copies the same text, and you paste it into the chat. An ask that you do not touch is reported as untouched. It is never consent.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"flow\">\u003cdiv class=\"fig-body\">\u003csvg class=\"flow\" viewBox=\"-35.3 -2 272 230\" width=\"272\" height=\"230\" role=\"img\" aria-label=\"Diagram: Two paths back to the agent. Send to cards serve (served page); cards serve to log.jsonl; log.jsonl to agent (cards wait); Send to clipboard (file page); clipboard to chat (you paste); chat to agent\">\u003cg class=\"fe\" data-a=\"0\" data-b=\"1\">\u003cpath d=\"M99.3,28 C99.3,47 50,47 50,66 M46,60 L50,66 L54,60\"/>\u003ctext x=\"45.9\" y=\"51.4\" text-anchor=\"end\" dominant-baseline=\"central\">served page\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"1\" data-b=\"2\">\u003cpath d=\"M50,94 C50,113 50,113 50,132 M46,126 L50,132 L54,126\"/>\u003c/g>\u003cg class=\"fe\" data-a=\"2\" data-b=\"3\">\u003cpath d=\"M50,160 C50,179 99.3,179 99.3,198 M95.3,192 L99.3,198 L103.3,192\"/ ominant-baseline=\"central\">chat\u003c/text>\u003c/g>\u003c/svg>\u003c/div>\u003cfigcaption>\u003cb>Fig. 11.1\u003c/b> Two paths back to the agent\u003c/figcaption>\u003c/figure>","wide":false,"fig_w":296,"facts":[],"depth_html":"\u003cul>\u003cli>The server listens on this machine only.\u003c/li>\u003cli>Every write needs the page token and the Origin of this server.\u003c/li>\u003cli>The server accepts only its own Host names.\u003c/li>\u003cli>A board id is a short name, never a path.\u003c/li>\u003cli>The server checks each reply item by its kind.\u003c/li>\u003c/ul>\u003cp>A code review found three holes in the first version. Each fix has a test in \u003ccode>test/review.test.mjs\u003c/code>. In this container, your browser cannot reach the server. Use the file page and Copy.\u003c/p>","options":[],"ask":null,"status":"open","basis":"fact","from":[],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":2,"rev":2,"at":"2026-10-09T05:36:26.523Z","title_html":"Replies reach the agent as files, not as copy-paste","gist_html":"\u003cp>With \u003ccode>cards serve\u003c/code>, Send writes a round to \u003ccode>log.jsonl\u003c/code>, and \u003ccode>cards wait\u003c/code> wakes the agent. Without a server, Send copies the same text for you to paste. An untouched ask is reported as untouched, never as consent.\u003c/p>"},{"v":1,"rev":1,"at":"2026-10-09T05:19:58.566Z","title_html":"Replies reach the agent as files, not as copy-paste","gist_html":"\u003cp>With \u003ccode>cards serve\u003c/code>, Send writes a round to \u003ccode>log.jsonl\u003c/code>, and \u003ccode>cards wait\u003c/code> wakes the agent. Without a server, Send copies the same text for you to paste. An untouched ask is reported as untouched, never as consent.\u003c/p>"}]},"ask-server":{"id":"ask-server","n":18,"v":4,"rev":7,"section":"replies-the-return-path","title_html":"Replies go through the local server when it is reachable, and by copy otherwise","title_text":"Replies go through the local server when it is reachable, and by copy otherwise","text":"Replies go through the local server when it is reachable, and by copy otherwise You confirmed this in round 1, and D8 records it. In this container your browser cannot reach the server, so round 1 came back by copy and paste.","gist_html":"\u003cp>You confirmed this in round 1, and D8 records it. In this container your browser cannot reach the server, so round 1 came back by copy and paste.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"facts":[],"depth_html":"","options":[],"ask":null,"status":"done","basis":null,"from":["return-channel"],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":3,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"Make the local server the default return path?","gist_html":"\u003cp>The server removes copy and paste. It is one more process to keep running. It listens on this machine only, so a browser outside this container cannot reach it yet. That needs a capability URL (D12).\u003c/p>"},{"v":2,"rev":4,"at":"2026-10-09T05:37:31.743Z","title_html":"Make the local server the default return path?","gist_html":"\u003cp>The server closes the loop without copy-paste. It is one more process. It binds to loopback only, so a browser outside this container cannot reach it yet; that needs a capability URL (D12).\u003c/p>"},{"v":1,"rev":1,"at":"2026-10-09T05:19:58.566Z","title_html":"Make the local server the default return path?","gist_html":"\u003cp>The server closes the loop without copy-paste. It is one more process, and from this container the host browser needs a published port to reach it.\u003c/p>"}]},"signal-cards":{"id":"signal-cards","n":13,"v":5,"rev":7,"section":"look-the-visual-direction","title_html":"Cards look like kanban signal cards on a steel rack","title_text":"Cards look like kanban signal cards on a steel rack","text":"Cards look like kanban signal cards on a steel rack Cards are card stock on cool grey steel, in one ink. A yellow-red tab stands up only where the agent waits on you. Blue marks only your own acts and your focus. On the desk, red marks a need and violet an option. Each color has one meaning. The design roll (f3a39d30, a pool of 7) chose the Toyota kanban world. Three other worlds each gave one rule. Patent drawings gave reference numerals and figure numbers. The Munich 1972 pictograms gave one color for each role. Bamboo-slip books gave a struck line for an old version. The colors are the JIS Z 9103 safety colors from factory floors. The desk adds a dot grid, and lines in the ink, in red and in violet. The full record is in DESIGN.md.","gist_html":"\u003cp>Cards are card stock on cool grey steel, in one ink. A yellow-red tab stands up only where the agent waits on you. Blue marks only your own acts and your focus. On the desk, red marks a need and violet an option. Each color has one meaning.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"facts":[],"depth_html":"\u003cp>The design roll (\u003ccode>f3a39d30\u003c/code>, a pool of 7) chose the Toyota kanban world. Three other worlds each gave one rule. Patent drawings gave reference numerals and figure numbers. The Munich 1972 pictograms gave one color for each role. Bamboo-slip books gave a struck line for an old version.\u003c/p>\u003cp>The colors are the JIS Z 9103 safety colors from factory floors. The desk adds a dot grid, and lines in the ink, in red and in violet. The full record is in \u003ccode>DESIGN.md\u003c/code>.\u003c/p>","options":[],"ask":null,"status":"open","basis":"inference","from":[],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":4,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"Cards look like kanban signal cards on a steel rack","gist_html":"\u003cp>Cards are card stock on cool grey steel, in one ink. A yellow-red tab stands up only where the agent waits on you. Blue marks only your own acts and your focus. There are two colors, and each has one meaning.\u003c/p>"},{"v":3,"rev":3,"at":"2026-10-09T05:36:36.128Z","title_html":"Kanban signal cards on a steel rack","gist_html":"\u003cp>Card stock on cool steel, in one ink. A yellow-red tab stands up only where the agent waits on you; the same tabs line up under the title as the andon rail. Blue marks only your own acts and focus. Two colors, one meaning each.\u003c/p>"},{"v":2,"rev":2,"at":"2026-10-09T05:36:26.523Z","title_html":"Kanban signal cards on a steel rack","gist_html":"\u003cp>Card stock sits on cool steel, printed in one ink. A yellow-red tab stands up only where the agent waits on you, and the same tabs line up under the title as the andon rail. Blue marks only your own acts and your focus: an answered tab turns to a blue outline that says what you did. Two colors, each with one meaning.\u003c/p>"},{"v":1,"rev":1,"at":"2026-10-09T05:19:58.566Z","title_html":"Kanban signal cards on a steel rack","gist_html":"\u003cp>Card stock sits on cool steel, printed in one ink. A yellow-red tab stands up only where the agent waits on you. Blue marks only your own acts and your focus. Two colors, each with one meaning.\u003c/p>"}]},"ask-visual":{"id":"ask-visual","n":19,"v":3,"rev":7,"section":"look-the-visual-direction","title_html":"The kanban look is approved","title_text":"The kanban look is approved","text":"The kanban look is approved You approved it in round 1, and D11 records it. Round 2 adds two line colors, each with one meaning: red for a need and violet for an option.","gist_html":"\u003cp>You approved it in round 1, and D11 records it. Round 2 adds two line colors, each with one meaning: red for a need and violet for an option.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"facts":[],"depth_html":"","options":[],"ask":null,"status":"done","basis":null,"from":["signal-cards"],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":2,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"Approve the visual direction: kanban signal cards on a steel rack?","gist_html":"\u003cp>The board that you read now is the sample, in both views. If you reject it, I roll a new direction and use your reason as the brief.\u003c/p>"},{"v":1,"rev":1,"at":"2026-10-09T05:19:58.566Z","title_html":"Approve the visual direction: kanban signal cards on a steel rack?","gist_html":"\u003cp>If you reject it, I roll the direction again and take your reason as the brief.\u003c/p>"}]},"unit-of-judgment":{"id":"unit-of-judgment","n":1,"v":2,"rev":5,"section":"foundation-decided-rules","title_html":"A card is the smallest unit you can judge and point at","title_text":"A card is the smallest unit you can judge and point at","text":"A card is the smallest unit you can judge and point at Agents now write more than people can read. You can judge a wall of prose only as a whole. You can keep, drop, answer or question one card. Its numeral lets you point in words: \"card 12 is wrong\". Karpathy names the job: \"a lot more of our work will rise up the abstractions into oversight and understanding\" (https://x.com/karpathy/status/2105819303471976479). In May 2026 he asked to \"point and gesture at the screen\" (https://x.com/karpathy/status/2053872850101285137).","gist_html":"\u003cp>Agents now write more than people can read. You can judge a wall of prose only as a whole. You can keep, drop, answer or question one card. Its numeral lets you point in words: &quot;card 12 is wrong&quot;.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"facts":[],"depth_html":"\u003cp>Karpathy names the job: &quot;a lot more of our work will rise up the abstractions into oversight and understanding&quot; (\u003ca href=\"https://x.com/karpathy/status/2105819303471976479\" target=\"_blank\" rel=\"noopener noreferrer\">https://x.com/karpathy/status/2105819303471976479\u003c/a>). In May 2026 he asked to &quot;point and gesture at the screen&quot; (\u003ca href=\"https://x.com/karpathy/status/2053872850101285137\" target=\"_blank\" rel=\"noopener noreferrer\">https://x.com/karpathy/status/2053872850101285137\u003c/a>).\u003c/p>","options":[],"ask":null,"status":"open","basis":"inference","from":[],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":1,"rev":1,"at":"2026-10-09T05:19:58.566Z","title_html":"A card is the smallest unit you can judge and point at","gist_html":"\u003cp>Agents now produce more than people can read. The human job is to judge the output. You can only judge a wall of prose as a whole. You can keep, drop, answer or question a card on its own.\u003c/p>"}]},"one-ask":{"id":"one-ask","n":2,"v":2,"rev":5,"section":"foundation-decided-rules","title_html":"Each card asks for one thing at most, and the top line says whose turn it is","title_text":"Each card asks for one thing at most, and the top line says whose turn it is","text":"Each card asks for one thing at most, and the top line says whose turn it is A card is something to read or one of three asks: choose, approve or answer. The top line counts what waits on you. The agent puts its questions in one batch, and you answer them in one pass.","gist_html":"\u003cp>A card is something to read or one of three asks: choose, approve or answer. The top line counts what waits on you. The agent puts its questions in one batch, and you answer them in one pass.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"facts":[],"depth_html":"","options":[],"ask":null,"status":"open","basis":"inference","from":["unit-of-judgment"],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":1,"rev":1,"at":"2026-10-09T05:19:58.566Z","title_html":"Each card asks for at most one thing, and the board shows whose turn it is","gist_html":"\u003cp>A card is either something to read or one of three asks: choose, approve, answer. The top line counts what waits on you, so you never search for the questions.\u003c/p>"}]},"cards-earned":{"id":"cards-earned","n":3,"v":2,"rev":5,"section":"foundation-decided-rules","title_html":"Use a board only when cards earn it; most replies stay prose","title_text":"Use a board only when cards earn it; most replies stay prose","text":"Use a board only when cards earn it; most replies stay prose Use a board for three or more separate judgments, for a decision that only you can make, or for work across turns. One explanation is a paragraph, not a board. The checker warns at more than five open asks.","gist_html":"\u003cp>Use a board for three or more separate judgments, for a decision that only you can make, or for work across turns. One explanation is a paragraph, not a board. The checker warns at more than five open asks.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"facts":[],"depth_html":"","options":[],"ask":null,"status":"open","basis":"inference","from":[],"needs":[],"when":{},"refs":[],"tags":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":1,"rev":1,"at":"2026-10-09T05:19:58.566Z","title_html":"Cards are earned; most agent replies stay prose","gist_html":"\u003cp>Use a board for several separate judgments, for a decision only the human can make, or for work that spans turns. One explanation is a paragraph or a page, not a board.\u003c/p>"}]},"five-primitives":{"id":"five-primitives","n":4,"v":2,"rev":5,"section":"foundation-decided-rules","title_html":"Five primitives carry the whole system","title_text":"Five primitives carry the whole system","text":"Five primitives carry the whole system The five primitives are board, section, card, link and response. A revision is not a primitive. The compiler finds revisions on every render. #+caption: How the five primitives fit #+begin_src flow board -> section: holds, in order section -> card: holds, in order card -> other card: link card -> response: your mark or answer #+end_src","gist_html":"\u003cp>The five primitives are board, section, card, link and response. A revision is not a primitive. The compiler finds revisions on every render.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"flow\">\u003cdiv class=\"fig-body\">\u003csvg class=\"flow\" viewBox=\"-2 -2 278 230\" width=\"278\" height=\"230\" role=\"img\" aria-label=\"Diagram: How the five primitives fit. board to section (holds, in order); section to card (holds, in order); card to other card (link); card to response (your mark or answer)\">\u003cg class=\"fe\" data-a=\"0\" data-b=\"1\">\u003cpath d=\"M98.5,28 C98.5,47 98.5,47 98.5,66 M94.5,60 L98.5,66 L102.5,60\"/>\u003ctext x=\"105.5\" y=\"42.6\" text-anchor=\"start\" dominant-baseline=\"central\">holds, in order\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"1\" data-b=\"2\">\u003cpath d=\"M98.5,94 C98.5,113 98.5,113 98.5,132 M94.5,126 L98.5,132 L102.5,126\"/>\u003ctext x=\"105.5\" y=\"108.6\" text-anchor=\"start\" dominant-baseline=\"central\">holds, in order\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"2\" data-b=\"3\">\u003cpath d=\"M91.5,160 C91.5,179 46,179 46,198 M42,192 L46,198 L50,192\"/>\u003ctext x=\"60.7\" y=\"174.6\" text-anchor=\"end\" dominant-baseline=\"central\">link\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"2\" data-b=\"4\">\u003cpath d=\"M105.5,160 C105.5,179 151,179 151,198 M147,192 L151,198 L155,192\"/>\u003ctext x=\"136.3\" y=\"174.6\" text-anchor=\"start\" dominant-baseline=\"central\">your mark or answer\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"0\">\u003crect x=\"70.5\" y=\"0\" width=\"56\" height=\"28\" rx=\"3\"/>\u003ctext x=\"98.5\" y=\"14\" text-anchor=\"middle\" dominant-baseline=\"central\">board\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"1\">\u003crect x=\"63\" y=\"66\" width=\"71\" height=\"28\" rx=\"3\"/>\u003ctext x=\"98.5\" y=\"80\" text-anchor=\"middle\" dominant-baseline=\"central\">section\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"2\">\u003crect x=\"74\" y=\"132\" width=\"49\" height=\"28\" rx=\"3\"/>\u003ctext <script>// digest.js -- the human's batch of responses, as text an agent reads.
//
// One implementation, two callers: the board page uses it for "Copy reply"
// when no server is running, and the CLI uses it for `cards inbox` and
// `cards wait`. Plain script on purpose, so it can be inlined into the page
// and imported by Node without a build step.
//
// The text is also a wire format: `cards ingest` reads a pasted reply back
// into the log (lib/ingest.mjs). So a line is `who  kind  what`, the human's
// words are JSON strings, and an option comes back as its key.
(function (root) {
  'use strict';

  // The human's words, exact: quotes and line breaks are escaped, nothing is cut.
  function quote(s) {
    return JSON.stringify(String(s).trim());
  }

  function pad(s, n) {
    s = String(s);
    return s.length >= n ? s + ' ' : s + ' '.repeat(n - s.length);
  }

  // A short key for one reply, so the same paste is recorded once and the
  // page knows its copied answers have arrived.
  function replyKey(batch) {
    var s = JSON.stringify([batch.rev, batch.at, batch.items]);
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 0x01000193) >>> 0;
    return ('0000000' + h.toString(16)).slice(-8);
  }

  // batch: { board: {id, title, path}, round, rev, at, key, pasted, items: [...] }
  // Commands in the text use `cards`, which SKILL.md defines as node <skill>/bin/cards.mjs.
  // cards: { [id]: { n, v, title } } -- the board as it is now
  function cardsDigest(batch, cards) {
    cards = cards || {};
    var lines = [];
    var b = batch.board || {};
    var num = function (id) { return cards[id] ? '#' + cards[id].n : id; };
    lines.push('cards: reply from the board ' + quote(b.title || b.id) + (b.id ? ' (' + b.id + ')' : ''));
    var head = [];
    if (b.path) head.push(b.path);
    if (batch.rev) head.push('rev ' + batch.rev);
    if (batch.round) head.push('round ' + batch.round);
    if (batch.at) head.push(String(batch.at).replace('T', ' ').slice(0, 16));
    if (batch.key) head.push('reply ' + batch.key);
    lines.push(head.join(' · '));
    lines.push('');

    var items = batch.items || [];
    if (!items.length) lines.push('  (no responses)');
    items.forEach(function (it) {
      var c = it.card ? cards[it.card] : null;
      var who = it.card ? (c ? '#' + c.n + ' ' : '') + it.card : it.section !== undefined ? '§' + it.section : 'board';
      var what;
      if (it.state === 'held') {
        // An ask that depends on another ask. It was not answered, or its answer was
        // made for a premise the human then changed: it is not an answer.
        var up = (it.needs || []).map(num).join(', ');
        what = it.why === 'changed' ? 'held: ' + up + ' changed from your suggestion; this ask was written for the suggestion. Ask again.'
          : it.why === 'skip' ? 'held: not needed; it applies to another answer of ' + up
          : 'held: waits for ' + up;
      } else switch (it.kind) {
        case 'choose':
          if (it.state === 'untouched') what = it.default && it.default.length === 0 ? 'untouched (no answer)' : 'untouched (suggestion kept; not consent)';
          else {
            what = it.state + ': ' + (it.value || []).join(', ');
            if (it.state === 'changed' && it.default && it.default.length) what += '  (you suggested ' + it.default.join(', ') + ')';
          }
          break;
        case 'approve':
          what = it.state === 'untouched' ? 'untouched (no answer; not consent)' : it.value === 'approve' ? 'approved' : 'rejected';
          break;
        case 'do':
          what = it.state === 'untouched' ? 'untouched (not done yet)' : it.value === 'done' ? 'done' : 'cannot';
          break;
        case 'answer':
          what = it.state === 'untouched' ? 'untouched (no answer)' : quote(it.text);
          break;
        case 'mark':
          what = { keep: 'keep (confirmed, keep it)', drop: 'drop (wrong or not needed)', more: 'more (go deeper)' }[it.value] || it.value;
          break;
        case 'reply':
        case 'note':
          what = quote(it.text);
          break;
        case 'order':
          what = (it.value || []).join(', ');
          break;
        default:
          what = JSON.stringify(it);
      }
      // Answered with the human's own override, after an ask it depends on changed.
      if (it.after && it.after.length) what += '  [answered after ' + it.after.map(num).join(', ') + ' changed]';
      var stale = c && it.v && c.v && it.v < c.v ? '  [answered on v' + it.v + ', card is now v' + c.v + ']' : '';
      lines.push('  ' + pad(who, 16) + pad(it.kind, 9) + what + stale);
    });
