oms at the pointer. - Drag the empty desk to move it. - You suggested 10%. At 10% a card is about 30 pixels wide, and no text can be read. Fit is the overview that fits the board you have. - At Fit, lines keep their width on the screen, and their ends keep their shape, so you can read the link types in the overview. - A phone opens on the rack. At phone width the whole desk fits only as a small map. D opens the desk.","gist_html":"\u003cp>The desk shows every card and every link at once. Fit picks the scale. Focus a card at a small scale, and the desk zooms to it. Esc goes back to where you were.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"sketch\">\u003cdiv class=\"fig-body\">\u003cpre class=\"sketch\" role=\"img\" aria-label=\"Sketch: Fit for the overview; a click zooms to one card; Esc goes back\">FIT: the whole board        click a card   100%: one card, its links\n┌─────────────────────────┐  ─────────►  ┌─────────────────────────┐\n│ [] [] [] [] [] [] [] [] │              │ ┌──────┐   ┌──────────┐ │\n│ [] [] [] [] [] [] []    │              │ │ 25   ├──►│ 17       │ │\n│ []    []    []    []    │  ◄─────────  │ └──────┘   │ Which... │ │\n└─────────────────────────┘      Esc     └─────────────────────────┘\u003c/pre>\u003c/div>\u003cfigcaption>\u003cb>Fig. 25.1\u003c/b> Fit for the overview; a click zooms to one card; Esc goes back\u003c/figcaption>\u003c/figure>","wide":true,"fig_w":514,"tbl_w":0,"facts":[],"depth_html":"\u003cul>\u003cli>Fit, 50% and 100% are buttons in the desk bar. \u003ccode>z\u003c/code> steps through them.\u003c/li>\u003cli>Ctrl or Cmd with the wheel, or a pinch on a trackpad, zooms at the pointer.\u003c/li>\u003cli>Drag the empty desk to move it.\u003c/li>\u003cli>You suggested 10%. At 10% a card is about 30 pixels wide, and no text can be read. Fit is the overview that fits the board you have.\u003c/li>\u003cli>At Fit, lines keep their width on the screen, and their ends keep their shape, so you can read the link types in the overview.\u003c/li>\u003cli>A phone opens on the rack. At phone width the whole desk fits only as a small map. \u003ccode>D\u003c/code> opens the desk.\u003c/li>\u003c/ul>","options":[],"ask":null,"status":"open","basis":"fact","from":["luhmann"],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":2,"rev":7,"at":"2026-10-09T09:39:17.985Z","title_html":"The board opens on the desk, zoomed to fit the whole board","gist_html":"\u003cp>The desk shows every card and every link at once. Fit picks the scale. Focus a card at a small scale, and the desk zooms to it. Esc goes back to where you were.\u003c/p>"},{"v":1,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"Rack to read, desk to see the links","gist_html":"\u003cp>Two views of one board. You read and answer on the rack. The desk puts each section in a column and draws lines between linked cards. A rule makes the layout, so nobody places a card.\u003c/p>"}]},"opt-free":{"id":"opt-free","n":26,"v":3,"rev":8,"section":"the-desk-canvas","title_html":"Drag a card by its top strip to place it; Arrange puts every card back","title_text":"Drag a card by its top strip to place it; Arrange puts every card back","text":"Drag a card by its top strip to place it; Arrange puts every card back The first drag keeps the layout as it stands, so nothing jumps. Only the card that you move moves, and it snaps to the dot grid. Arrange puts every card back in its section, with Undo. #+caption: The top strip is the handle; the dots are the grid #+begin_src sketch ┌─ 12 · Fact ────────────────┐ ◄ top strip: drag here │ The claim, in one sentence │ │ The gist │ └────────────────────────────┘ · · · · · · · ◄ dot grid: the card snaps here #+end_src - Your layout stays in this browser. The agent never sees it, and board.org does not change. Luhmann kept each card at one address; the desk is where you work with them. - On your layout a line cannot always go around a card. Lines then lie above the cards, faint where they cross one. - A card that the agent adds later goes to a new column at the right, so nothing that you placed moves. - Alt with the arrow keys moves a placed card one grid step. - On a touch screen, drag the grip in the card footer. A swipe on a card moves the desk.","gist_html":"\u003cp>The first drag keeps the layout as it stands, so nothing jumps. Only the card that you move moves, and it snaps to the dot grid. Arrange puts every card back in its section, with Undo.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"sketch\">\u003cdiv class=\"fig-body\">\u003cpre class=\"sketch\" role=\"img\" aria-label=\"Sketch: The top strip is the handle; the dots are the grid\">┌─ 12 · Fact ────────────────┐  ◄ top strip: drag here\n│ The claim, in one sentence │\n│ The gist                   │\n└────────────────────────────┘\n ·   ·   ·   ·   ·   ·   ·      ◄ dot grid: the card snaps here\u003c/pre>\u003c/div>\u003cfigcaption>\u003cb>Fig. 26.1\u003c/b> The top strip is the handle; the dots are the grid\u003c/figcaption>\u003c/figure>","wide":true,"fig_w":478,"tbl_w":0,"facts":[],"depth_html":"\u003cul>\u003cli>Your layout stays in this browser. The agent never sees it, and \u003ccode>board.org\u003c/code> does not change. Luhmann kept each card at one address; the desk is where you work with them.\u003c/li>\u003cli>On your layout a line cannot always go around a card. Lines then lie above the cards, faint where they cross one.\u003c/li>\u003cli>A card that the agent adds later goes to a new column at the right, so nothing that you placed moves.\u003c/li>\u003cli>Alt with the arrow keys moves a placed card one grid step.\u003c/li>\u003cli>On a touch screen, drag the grip in the card footer. A swipe on a card moves the desk.\u003c/li>\u003c/ul>","options":[],"ask":null,"status":"open","basis":"fact","from":["opt-desk"],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":2,"rev":7,"at":"2026-10-09T09:39:17.985Z","title_html":"Drag a card by its top strip to place it; Arrange puts every card back","gist_html":"\u003cp>The first drag keeps the layout as it stands, so nothing jumps. Only the card that you move moves, and it snaps to the dot grid. Arrange puts every card back in its section, with Undo.\u003c/p>"},{"v":1,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"Desk with free placement: you move the cards","gist_html":"\u003cp>The desk from the second option, and you can also drag a card to any place. Your layout stays until you reset it. People remember a layout that they make. The cost is the time to arrange it.\u003c/p>"}]},"desk-rules":{"id":"desk-rules","n":27,"v":3,"rev":7,"section":"the-desk-canvas","title_html":"Each link type has its own line color and end shape","title_text":"Each link type has its own line color and end shape","text":"Each link type has its own line color and end shape A line means \"feeds into\" and points to the card that uses the other one. The color and the end shape tell the type, so you can read a link without focus. The key at the top of the desk names each type. - Source :: grey line, open arrow; from :FROM: - Needs :: red line, filled arrow; from :NEEDS: - Option :: violet line, a diamond at the decision; an option of a choose card - Mention :: dashed line, a dot; id in text, shown only for the card in focus - Focus thickens the lines of one card and fades the rest. The far card names the link, for example \"Option of 17\". - Red already meant \"blocked\", and a need is what blocks a card. Violet is new and has one meaning: an option. - A line starts and ends at the address line, where the numeral is. - On the section layout, a line between far columns crosses each column in a gap between cards, never behind a card. - Two links between the same two cards draw one line. The more specific link wins.","gist_html":"\u003cp>A line means &quot;feeds into&quot; and points to the card that uses the other one. The color and the end shape tell the type, so you can read a link without focus. The key at the top of the desk names each type.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"tbl_w":0,"facts":[["Source","grey line, open arrow; from \u003ccode>:FROM:\u003c/code>","Source"],["Needs","red line, filled arrow; from \u003ccode>:NEEDS:\u003c/code>","Needs"],["Option","violet line, a diamond at the decision; an option of a choose card","Option"],["Mention","dashed line, a dot; \u003ccode>[[#id]]\u003c/code> in text, shown only for the card in focus","Mention"]],"depth_html":"\u003cul>\u003cli>Focus thickens the lines of one card and fades the rest. The far card names the link, for example &quot;Option of 17&quot;.\u003c/li>\u003cli>Red already meant &quot;blocked&quot;, and a need is what blocks a card. Violet is new and has one meaning: an option.\u003c/li>\u003cli>A line starts and ends at the address line, where the numeral is.\u003c/li>\u003cli>On the section layout, a line between far columns crosses each column in a gap between cards, never behind a card.\u003c/li>\u003cli>Two links between the same two cards draw one line. The more specific link wins.\u003c/li>\u003c/ul>","options":[],"ask":null,"status":"open","basis":"fact","from":["opt-desk"],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":2,"rev":6,"at":"2026-10-09T08:38:35.548Z","title_html":"On the desk, a line means &quot;feeds into&quot;, and the far card names the link","gist_html":"\u003cp>Three links draw lines: \u003ccode>from=\u003c/code>, \u003ccode>needs=\u003c/code>, and the options of a decision. A mention draws a dashed line only for the card in focus. Focus turns the lines of that card blue. Each card at the far end names its link, for example &quot;Source of 8&quot;.\u003c/p>"},{"v":1,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"On the desk, a line means &quot;feeds into&quot;, and the far card names the link","gist_html":"\u003cp>Three links draw lines: \u003ccode>from=\u003c/code>, \u003ccode>needs=\u003c/code>, and the options of a decision. A mention draws a dotted line only for the card in focus. Focus turns the lines of that card blue. Each card at the far end names its link, for example &quot;Source of 8&quot;.\u003c/p>"}]},"desk-note":{"id":"desk-note","n":33,"v":2,"rev":10,"section":"the-desk-canvas","title_html":"You chat with the agent in a box in the bottom-right corner","title_text":"You chat with the agent in a box in the bottom-right corner","text":"You chat with the agent in a box in the bottom-right corner The note about the whole board is now a chat. Press c, write, and press Enter: the message goes now, as its own round. The agent answers with cards say, and the answer shows in the box. A yellow-red dot on the closed box means that the agent wrote. #+caption: The chat box: your messages on the right, the agent's on the left #+begin_src sketch ┌ The agent ───────── Your turn · Close ┐ │ ┌─────────────────────────┐ │ │ │ Also compare managed │ │ ◄ you: blue │ │ Kafka. Round 1 · read │ │ │ └─────────────────────────┘ │ │ ┌─────────────────────────┐ │ │ │ Got it: a card is next. │ │ ◄ the agent │ └─────────────────────────┘ │ │ The agent published rev 8 │ ◄ a revision ├───────────────────────────────────────┤ │ Message the agent [Send] │ └───────────────────────────────────────┘ #+end_src - Card answers still go together, with Send in the toolbar. A chat message goes alone and at once. - Esc in the first 5 seconds takes the message back into the box. - On a file page there is no server, so Send copies the message for you to paste. - The thread shows your rounds, the agent's messages and each revision that the agent published, in time order.","gist_html":"\u003cp>The note about the whole board is now a chat. Press \u003ccode>c\u003c/code>, write, and press Enter: the message goes now, as its own round. The agent answers with \u003ccode>cards say\u003c/code>, and the answer shows in the box. A yellow-red dot on the closed box means that the agent wrote.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"sketch\">\u003cdiv class=\"fig-body\">\u003cpre class=\"sketch\" role=\"img\" aria-label=\"Sketch: The chat box: your messages on the right, the agent&#39;s on the left\">┌ The agent ───────── Your turn · Close ┐\n│          ┌─────────────────────────┐  │\n│          │ Also compare managed    │  │ ◄ you: blue\n│          │ Kafka.   Round 1 · read │  │\n│          └─────────────────────────┘  │\n│ ┌─────────────────────────┐           │\n│ │ Got it: a card is next. │           │ ◄ the agent\n│ └─────────────────────────┘           │\n│      The agent published rev 8        │ ◄ a revision\n├───────────────────────────────────────┤\n│ Message the agent             [Send]  │\n└───────────────────────────────────────┘\u003c/pre>\u003c/div>\u003cfigcaption>\u003cb>Fig. 33.1\u003c/b> The chat box: your messages on the right, the agent&#39;s on the left\u003c/figcaption>\u003c/figure>","wide":true,"fig_w":413,"tbl_w":0,"facts":[],"depth_html":"\u003cul>\u003cli>Card answers still go together, with Send in the toolbar. A chat message goes alone and at once.\u003c/li>\u003cli>Esc in the first 5 seconds takes the message back into the box.\u003c/li>\u003cli>On a file page there is no server, so Send copies the message for you to paste.\u003c/li>\u003cli>The thread shows your rounds, the agent&#39;s messages and each revision that the agent published, in time order.\u003c/li>\u003c/ul>","options":[],"ask":null,"status":"open","basis":"fact","from":[],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":1,"rev":7,"at":"2026-10-09T09:39:17.985Z","title_html":"The note to the agent is a dock in the bottom-left corner","gist_html":"\u003cp>The note about the whole board was a footer under the last section. It is now a dock that stays in reach in both views. Press \u003ccode>c\u003c/code> to open it. Esc closes it and keeps the draft. A blue dot shows a drafted note.\u003c/p>"}]},"ask-canvas":{"id":"ask-canvas","n":34,"v":4,"rev":11,"section":"the-desk-canvas","title_html":"The desk canvas is approved as built, with its five choices","title_text":"The desk canvas is approved as built, with its five choices","text":"The desk canvas is approved as built, with its five choices You approved it in round 2, and D17 records it. The five choices stay as built. 1. Fit, 50% and 100% replace 10%. 2. The top strip of a card is the drag handle. 3. Your layout stays in this browser. 4. A card that the agent adds goes to a new column at the right. 5. A phone opens on the rack.","gist_html":"\u003cp>You approved it in round 2, and D17 records it. The five choices stay as built.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"tbl_w":0,"facts":[],"depth_html":"\u003col>\u003cli>Fit, 50% and 100% replace 10%.\u003c/li>\u003cli>The top strip of a card is the drag handle.\u003c/li>\u003cli>Your layout stays in this browser.\u003c/li>\u003cli>A card that the agent adds goes to a new column at the right.\u003c/li>\u003cli>A phone opens on the rack.\u003c/li>\u003c/ol>","options":[],"ask":null,"status":"done","basis":null,"from":["opt-desk","opt-free","desk-rules","desk-note"],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":3,"rev":9,"at":"2026-10-09T09:59:59.916Z","title_html":"Approve the desk canvas as built?","gist_html":"\u003cp>Five choices in the canvas are mine, not yours. Approve them all, or reject and reply with the number of the choice to change.\u003c/p>"},{"v":2,"rev":8,"at":"2026-10-09T09:59:52.003Z","title_html":"Approve the desk canvas as built?","gist_html":"\u003cp>Five choices here are mine, not yours. Fit, 50% and 100% replace 10%. The top strip is the drag handle. Your layout stays in this browser. New cards go to a column at the right. A phone opens on the rack. If you reject, reply with the choice to change.\u003c/p>"},{"v":1,"rev":7,"at":"2026-10-09T09:39:17.985Z","title_html":"Approve the desk canvas as built?","gist_html":"\u003cp>Four choices here are mine, not yours. Fit, 50% and 100% replace 10%. The top strip is the drag handle. Your layout stays in this browser. New cards go to a column at the right. If you reject, reply with the choice to change.\u003c/p>"}]},"org-format":{"id":"org-format","n":35,"v":1,"rev":7,"section":"org-the-board-format","title_html":"Boards are plain Org, with nothing invented on top of it","title_text":"Boards are plain Org, with nothing invented on top of it","text":"Boards are plain Org, with nothing invented on top of it A section is a * heading, and a card is a * heading. A property drawer holds the id and the links. The TODO keyword is the status. The markdown dialect needed its own {...} attributes; Org needs none. - card :: * The claim, then a :PROPERTIES: drawer (was ## The claim {#id}) - status :: the TODO keyword: DOING, BLOCKED, DONE (was status=done) - progress :: a cookie at the end of the claim, [3/8] (was progress=3/8) - facts :: a description list, - key :: value (was a facts fence) - figure :: #+caption:, then #+begin_src sketch or flow - link :: id (was id) The spec is skill/reference/format.md. The board reads correctly in Emacs, on GitHub, and in any editor. An older board.md still renders.","gist_html":"\u003cp>A section is a \u003ccode>*\u003c/code> heading, and a card is a \u003ccode>**\u003c/code> heading. A property drawer holds the id and the links. The TODO keyword is the status. The markdown dialect needed its own \u003ccode>{...}\u003c/code> attributes; Org needs none.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"tbl_w":0,"facts":[["card","\u003ccode>** The claim\u003c/code>, then a \u003ccode>:PROPERTIES:\u003c/code> drawer (was \u003ccode>## The claim {#id}\u003c/code>)","card"],["status","the TODO keyword: \u003ccode>DOING\u003c/code>, \u003ccode>BLOCKED\u003c/code>, \u003ccode>DONE\u003c/code> (was \u003ccode>status=done\u003c/code>)","status"],["progress","a cookie at the end of the claim, \u003ccode>[3/8]\u003c/code> (was \u003ccode>progress=3/8\u003c/code>)","progress"],["facts","a description list, \u003ccode>- key :: value\u003c/code> (was a facts fence)","facts"],["figure","\u003ccode>#+caption:\u003c/code>, then \u003ccode>#+begin_src sketch\u003c/code> or \u003ccode>flow\u003c/code>","figure"],["link","\u003ccode>[[#id]]\u003c/code> (was \u003ccode>[[id]]\u003c/code>)","link"]],"depth_html":"\u003cp>The spec is \u003ccode>skill/reference/format.md\u003c/code>. The board reads correctly in Emacs, on GitHub, and in any editor. An older \u003ccode>board.md\u003c/code> still renders.\u003c/p>","options":[],"ask":null,"status":"open","basis":"fact","from":[],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[]},"org-meaning":{"id":"org-meaning","n":36,"v":1,"rev":7,"section":"org-the-board-format","title_html":"Converting a board to Org is not a revision; a change in meaning is","title_text":"Converting a board to Org is not a revision; a change in meaning is","text":"Converting a board to Org is not a revision; a change in meaning is The compiler compares what a card means: its claim, its links, and its rendered body. This board went from markdown to Org, and the cards that did not change kept their versions. A re-wrapped paragraph is not a new version either. #+caption: What decides a new version #+begin_src flow card in board.md -> meaning: parse, render card in board.org -> meaning: parse, render meaning -> same version: equal meaning --> new version: different #+end_src","gist_html":"\u003cp>The compiler compares what a card means: its claim, its links, and its rendered body. This board went from markdown to Org, and the cards that did not change kept their versions. A re-wrapped paragraph is not a new version either.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"flow\">\u003cdiv class=\"fig-body\">\u003csvg class=\"flow\" viewBox=\"-2 -2 334 204\" width=\"334\" height=\"204\" role=\"img\" aria-label=\"Diagram: What decides a new version. card in board.md to meaning (parse, render); card in board.org to meaning (parse, render); meaning to same version (equal); meaning to new version (different)\">\u003cg class=\"fe\" data-a=\"0\" data-b=\"1\">\u003cpath d=\"M68,28 L68,61 Q68,65 72,65 L136.8,65 Q140.8,65 140.8,69 L140.8,78 M136.8,72 L140.8,78 L144.8,72\"/>\u003ctext x=\"74\" y=\"40\" text-anchor=\"start\" dominant-baseline=\"central\">parse, render\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"2\" data-b=\"1\">\u003cpath d=\"M227.5,28 L227.5,61 Q227.5,65 223.5,65 L158.8,65 Q154.8,65 154.8,69 L154.8,78 M150.8,72 L154.8,78 L158.8,72\"/>\u003ctext x=\"233.5\" y=\"40\" text-anchor=\"start\" dominant-baseline=\"central\">parse, render\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"1\" data-b=\"3\">\u003cpath d=\"M140.8,106 L140.8,155 Q140.8,159 136.8,159 L90,159 Q86,159 86,163 L86,172 M82,166 L86,172 L90,166\"/>\u003ctext x=\"134.8\" y=\"118\" text-anchor=\"end\" dominant-baseline=\"central\">equal\u003c/text>\u003c/g>\u003cg class=\"fe dash\" data-a=\"1\" data-b=\"4\">\u003cpath d=\"M154.8,106 L154.8,155 Q154.8,159 158.8,159 L205.5,159 Q209.5,159 209.5,163 L209.5,172 M205.5,166 L209.5,172 L213.5,166\"/>\u003ctext x=\"160.8\" y=\"118\" text-anchor=\"start\" dominant-baseline=\"central\">different\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"0\" data-part=\"card-in-board.md\">\u003crect x=\"0\" y=\"0\" width=\"136\" height=\"28\" rx=\"3\"/>\u003ctext x=\"68\" y=\"14\" text-anchor=\"middle\" dominant-baseline=\"central\">card in board.md\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"1\" data-part=\"meaning\">\u003crect x=\"112.3\" y=\"78\" width=\"71\" height=\"28\" rx=\"3\"/>\u003ctext x=\"147.8\" y=\"92\" text-anchor=\"middle\" dominant-baseline=\"central\">meaning\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"2\" data-part=\"card-in-board.org\">\u003crect x=\"156\" y=\"0\" width=\"143\" height=\"28\" rx=\"3\"/>\u003ctext x=\"227.5\" y=\"14\" text-anchor=\"middle\" dominant-baseline=\"central\">card in board.org\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"3\" data-part=\"same-version\">\u003crect x=\"32.5\" y=\"172\" width=\"107\" height=\"28\" rx=\"3\"/>\u003ctext x=\"86\" y=\"186\" text-anchor=\"middle\" dominant-baseline=\"central\">same version\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"4\" data-part=\"new-version\">\u003crect x=\"159.5\" y=\"172\" width=\"100\" height=\"28\" rx=\"3\"/>\u003ctext x=\"209.5\" y=\"186\" text-anchor=\"middle\" dominant-baseline=\"central\">new version\u003c/text>\u003c/g>\u003c/svg>\u003c/div>\u003cfigcaption>\u003cb>Fig. 36.1\u003c/b> What decides a new version\u003c/figcaption>\u003c/figure>","wide":true,"fig_w":358,"tbl_w":0,"facts":[],"depth_html":"","options":[],"ask":null,"status":"open","basis":"fact","from":["org-format"],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[]},"rethink-lines":{"id":"rethink-lines","n":22,"v":1,"rev":5,"section":"links-why-lines-came-back","title_html":"The old proposal hid every line, so you could not see the structure","title_text":"The old proposal hid every line, so you could not see the structure","text":"The old proposal hid every line, so you could not see the structure We rejected a canvas for one reason: a person remembers a layout only when they place the cards. Here the agent places the cards. That reason is about memory, not about structure. With no lines, you see the links of one card at a time. #+caption: Rack, card 6 in focus: you see the links of card 6 only #+begin_src sketch ┌─ 5 ────────────┐ ┌─ 6 ────────────┐ ┌─ 7 ────────────┐ │ (dimmed) │ │ IN FOCUS │ │ Source of 6 │ │ │ │ Sources: 7 │ │ │ └────────────────┘ └────────────────┘ └────────────────┘ ┌─ 8 ────────────┐ ┌─ 9 ────────────┐ ┌─ 10 ───────────┐ │ (dimmed) │ │ Decides 6 │ │ (dimmed) │ │ links to 5 and │ │ │ │ needs 8 │ │ 10: not shown │ │ │ │ not shown │ └────────────────┘ └────────────────┘ └────────────────┘ #+end_src | The reason we gave | What it missed | |---+---| | A canvas helps only when the human places the cards. | A canvas also shows the structure. A layout by rule gives that, and nobody places a card. | | Lines tangle past about 30 cards. | A board has 30 cards at most, and cards check warns past that. Only three link types draw lines. | | Builders of canvases report \"paper cuts\" and mess. | Those canvases had free placement. A layout by rule has no placement to keep tidy. | | An AI re-layout breaks your memory of the layout. | A layout by rule changes only when the board changes. Changed cards show \"Changed\". | | Focus light still works at 200 cards. | Focus shows one card at a time. Our research named that cost: \"there is no overview\" (model C in docs/research/connected-cards-prior-art.md). |","gist_html":"\u003cp>We rejected a canvas for one reason: a person remembers a layout only when they place the cards. Here the agent places the cards. That reason is about memory, not about structure. With no lines, you see the links of one card at a time.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"sketch\">\u003cdiv class=\"fig-body\">\u003cpre class=\"sketch\" role=\"img\" aria-label=\"Sketch: Rack, card 6 in focus: you see the links of card 6 only\">┌─ 5 ────────────┐  ┌─ 6 ────────────┐  ┌─ 7 ────────────┐\n│ (dimmed)       │  │ IN FOCUS       │  │ Source of 6    │\n│                │  │ Sources: 7     │  │                │\n└────────────────┘  └────────────────┘  └────────────────┘\n┌─ 8 ────────────┐  ┌─ 9 ────────────┐  ┌─ 10 ───────────┐\n│ (dimmed)       │  │ Decides 6      │  │ (dimmed)       │\n│ links to 5 and │  │                │  │ needs 8        │\n│ 10: not shown  │  │                │  │ not shown      │\n└────────────────┘  └────────────────┘  └────────────────┘\u003c/pre>\u003c/div>\u003cfigcaption>\u003cb>Fig. 22.1\u003c/b> Rack, card 6 in focus: you see the links of card 6 only\u003c/figcaption>\u003c/figure>","wide":true,"fig_w":442,"tbl_w":398,"facts":[],"depth_html":"\u003cdiv class=\"table\" data-cols=\"2\">\u003ctable role=\"table\">\u003cthead role=\"rowgroup\">\u003ctr role=\"row\">\u003cth role=\"columnheader\">The reason we gave\u003c/th>\u003cth role=\"columnheader\">What it missed\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody role=\"rowgroup\">\u003ctr role=\"row\">\u003ctd role=\"cell\" data-label=\"The reason we gave\">A canvas helps only when the human places the cards.\u003c/td>\u003ctd role=\"cell\" data-label=\"What it missed\">A canvas also shows the structure. A layout by rule gives that, and nobody places a card.\u003c/td>\u003c/tr>\u003ctr role=\"row\">\u003ctd role=\"cell\" data-label=\"The reason we gave\">Lines tangle past about 30 cards.\u003c/td>\u003ctd role=\"cell\" data-label=\"What it missed\">A board has 30 cards at most, and \u003ccode>cards check\u003c/code> warns past that. Only three link types draw lines.\u003c/td>\u003c/tr>\u003ctr role=\"row\">\u003ctd role=\"cell\" data-label=\"The reason we gave\">Builders of canvases report &quot;paper cuts&quot; and mess.\u003c/td>\u003ctd role=\"cell\" data-label=\"What it missed\">Those canvases had free placement. A layout by rule has no placement to keep tidy.\u003c/td>\u003c/tr>\u003ctr role=\"row\">\u003ctd role=\"cell\" data-label=\"The reason we gave\">An AI re-layout breaks your memory of the layout.\u003c/td>\u003ctd role=\"cell\" data-label=\"What it missed\">A layout by rule changes only when the board changes. Changed cards show &quot;Changed&quot;.\u003c/td>\u003c/tr>\u003ctr role=\"row\">\u003ctd role=\"cell\" data-label=\"The reason we gave\">Focus light still works at 200 cards.\u003c/td>\u003ctd role=\"cell\" data-label=\"What it missed\">Focus shows one card at a time. Our research named that cost: &quot;there is no overview&quot; (model C in \u003ccode>docs/research/connected-cards-prior-art.md\u003c/code>).\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>","options":[],"ask":null,"status":"open","basis":"inference","from":[],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[]},"luhmann":{"id":"luhmann","n":23,"v":2,"rev":7,"section":"links-why-lines-came-back","title_html":"Luhmann never moved a card: he took cards out to use them and put each one back","title_text":"Luhmann never moved a card: he took cards out to use them and put each one back","text":"Luhmann never moved a card: he took cards out to use them and put each one back Each card had a fixed address, because finding a card depended on it. A card in the wrong place got a link, not a new place. He took a card out to use it and put it back in the same place. We found no source that he spread cards on a desk to write. #+caption: The box keeps each card at its address; work uses a few cards #+begin_src sketch THE BOX: one fixed address for each card ┌───────┬────────┬─────────┬───────┐ │ 57/12 │ 57/12a │ 57/12a1 │ 57/13 │ ... 21/3d └───────┴─┬────▲─┴─────────┴───────┘ │ │ take out │ │ put back, same place ▼ │ THE WORK: a few cards at a time ┌────────┐ ┌───────┐ │ 57/12a │ │ 21/3d │ far link on 57/12a: \"21/3d\" └────────┘ └───────┘ #+end_src - cards :: about 90,000, in two collections - address :: fixed; 57/12 goes on as 57/13 or branches as 57/12a - wrong place :: fixed by a link, never by a move - far links :: about 50,000, written by hand on the cards - way in :: a short index, 1 to 4 cards for each keyword What this means for the board: - The rack is the box. Each card keeps one numeral and one place in board.org. - The desk is the work. It shows the same cards and moves none of them in board.org. - His far links are our from=, needs= and id. He walked them by hand. The desk draws them. - His editors drew an arc diagram of the links in one drawer to see where links are dense. The arcs in a desk column are the same kind of drawing. The picture of Luhmann with cards spread across a desk is not in the sources we read. The closest source is his 1968 rule: \"take it out when you use it, and put it back in exactly the same place\". A 1987 interview, through Johannes Schmidt, calls his writing for one talk \"a kind of collaging technique\". So the desk is our design, not his method. The 1987 interview itself is unread. Sources and quotes are in docs/research/luhmann-zettelkasten.md.","gist_html":"\u003cp>Each card had a fixed address, because finding a card depended on it. A card in the wrong place got a link, not a new place. He took a card out to use it and put it back in the same place. We found no source that he spread cards on a desk to write.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"sketch\">\u003cdiv class=\"fig-body\">\u003cpre class=\"sketch\" role=\"img\" aria-label=\"Sketch: The box keeps each card at its address; work uses a few cards\">THE BOX: one fixed address for each card\n┌───────┬────────┬─────────┬───────┐\n│ 57/12 │ 57/12a │ 57/12a1 │ 57/13 │  ...  21/3d\n└───────┴─┬────▲─┴─────────┴───────┘\n          │    │\n take out │    │ put back, same place\n          ▼    │\nTHE WORK: a few cards at a time\n┌────────┐  ┌───────┐\n│ 57/12a │  │ 21/3d │   far link on 57/12a: &quot;21/3d&quot;\n└────────┘  └───────┘\u003c/pre>\u003c/div>\u003cfigcaption>\u003cb>Fig. 23.1\u003c/b> The box keeps each card at its address; work uses a few cards\u003c/figcaption>\u003c/figure>","wide":true,"fig_w":392,"tbl_w":0,"facts":[["cards","about 90,000, in two collections","cards"],["address","fixed; 57/12 goes on as 57/13 or branches as 57/12a","address"],["wrong place","fixed by a link, never by a move","wrong place"],["far links","about 50,000, written by hand on the cards","far links"],["way in","a short index, 1 to 4 cards for each keyword","way in"]],"depth_html":"\u003cp>What this means for the board:\u003c/p>\u003cul>\u003cli>The rack is the box. Each card keeps one numeral and one place in board.org.\u003c/li>\u003cli>The desk is the work. It shows the same cards and moves none of them in board.org.\u003c/li>\u003cli>His far links are our \u003ccode>from=\u003c/code>, \u003ccode>needs=\u003c/code> and \u003ccode>[[id]]\u003c/code>. He walked them by hand. The desk draws them.\u003c/li>\u003cli>His editors drew an arc diagram of the links in one drawer to see where links are dense. The arcs in a desk column are the same kind of drawing.\u003c/li>\u003c/ul>\u003cp>The picture of Luhmann with cards spread across a desk is not in the sources we read. The closest source is his 1968 rule: &quot;take it out when you use it, and put it back in exactly the same place&quot;. A 1987 interview, through Johannes Schmidt, calls his writing for one talk &quot;a kind of collaging technique&quot;. So the desk is our design, not his method. The 1987 interview itself is unread. Sources and quotes are in \u003ccode>docs/research/luhmann-zettelkasten.md\u003c/code>.\u003c/p>","options":[],"ask":null,"status":"open","basis":"fact","from":[],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":1,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"Luhmann never moved a card: he took cards out to use them and put each one back","gist_html":"\u003cp>Each card had a fixed address, because finding a card depended on it. A card in the wrong place got a link, not a new place. He took a card out to use it and put it back in the same place. We found no source that he spread cards on a desk to write.\u003c/p>"}]},"ask-connection":{"id":"ask-connection","n":17,"v":3,"rev":7,"section":"links-why-lines-came-back","title_html":"The board opens on the desk; the rack is one key away","title_text":"The board opens on the desk; the rack is one key away","text":"The board opens on the desk; the rack is one key away You chose this in round 1: the rack and the desk, with the board opening on the desk. D15 records it. The desk now also zooms, and you can place the cards yourself: see opt-desk and opt-free.","gist_html":"\u003cp>You chose this in round 1: the rack and the desk, with the board opening on the desk. D15 records it. The desk now also zooms, and you can place the cards yourself: see \u003ca class=\"ref\" href=\"#c-opt-desk\" data-ref=\"opt-desk\">\u003cspan class=\"ref-n\">25\u003c/span>\u003cspan class=\"ref-t\">The board opens on the desk, zoomed to fit the whole board\u003c/span>\u003c/a> and \u003ca class=\"ref\" href=\"#c-opt-free\" data-ref=\"opt-free\">\u003cspan class=\"ref-n\">26\u003c/span>\u003cspan class=\"ref-t\">Drag a card by its top strip to place it; Arrange puts every card back\u003c/span>\u003c/a>.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"tbl_w":0,"facts":[],"depth_html":"","options":[],"ask":null,"status":"done","basis":null,"from":["rethink-lines"],"needs":[],"when":{},"refs":["opt-desk","opt-free"],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":2,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"Which view do we keep for links?","gist_html":"\u003cp>The rack stays for reading and answering in every option. The question is how you see the links. I recommend the rack and the desk, with the board opening on the rack.\u003c/p>"},{"v":1,"rev":1,"at":"2026-10-09T05:19:58.566Z","title_html":"Keep the connection model: sections, numerals and focus light, with no edges?","gist_html":"\u003cp>This is the biggest bet. A spatial canvas is the main alternative. The research says a canvas costs arranging time and tangles past 30 cards.\u003c/p>"}]},"show-first":{"id":"show-first","n":28,"v":2,"rev":6,"section":"figures-show-then-tell","title_html":"A card shows the shape it talks about, and the text names it","title_text":"A card shows the shape it talks about, and the text names it","text":"A card shows the shape it talks about, and the text names it When a claim is about a layout, a flow or a structure, the card carries a figure. A decision about a view shows each option as a sketch. The first figure shows at the Gist level, under the gist. #+caption: Card anatomy: what shows at each level #+begin_src sketch ┌ Choose ┐ ◄ tab: an ask waits on you ┌┴────────┴────────────────────┐ │ 12 Inference v2 │ ◄ numeral and basis │ The claim, in one sentence │ ◄ Claim level │ The gist, in one paragraph │ ◄ Gist level │ ┌──────────────────────────┐ │ │ │ figure │ │ ◄ Gist level, Fig. 12.1 │ └──────────────────────────┘ │ │ facts and options │ ◄ Gist level │ depth: reasons, sources │ ◄ Full level └──────────────────────────────┘ #+end_src Figures have numbers, like card numerals: Fig. 12.1 is the first figure on card 12. You can point at a figure in words.","gist_html":"\u003cp>When a claim is about a layout, a flow or a structure, the card carries a figure. A decision about a view shows each option as a sketch. The first figure shows at the Gist level, under the gist.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"sketch\">\u003cdiv class=\"fig-body\">\u003cpre class=\"sketch\" role=\"img\" aria-label=\"Sketch: Card anatomy: what shows at each level\"> ┌ Choose ┐                       ◄ tab: an ask waits on you\n┌┴────────┴────────────────────┐\n│ 12  Inference  v2            │  ◄ numeral and basis\n│ The claim, in one sentence   │  ◄ Claim level\n│ The gist, in one paragraph   │  ◄ Gist level\n│ ┌──────────────────────────┐ │\n│ │ figure                   │ │  ◄ Gist level, Fig. 12.1\n│ └──────────────────────────┘ │\n│ facts and options            │  ◄ Gist level\n│ depth: reasons, sources      │  ◄ Full level\n└──────────────────────────────┘\u003c/pre>\u003c/div>\u003cfigcaption>\u003cb>Fig. 28.1\u003c/b> Card anatomy: what shows at each level\u003c/figcaption>\u003c/figure>","wide":true,"fig_w":456,"tbl_w":0,"facts":[],"depth_html":"\u003cp>Figures have numbers, like card numerals: Fig. 12.1 is the first figure on card 12. You can point at a figure in words.\u003c/p>","options":[],"ask":null,"status":"open","basis":"fact","from":[],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":1,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"A card shows the shape it talks about, and the text names it","gist_html":"\u003cp>When a claim is about a layout, a flow or a structure, the card carries a figure. A decision about a view shows each option as a sketch. The first figure shows at the Gist level, under the gist.\u003c/p>"}]},"fig-sketch":{"id":"fig-sketch","n":29,"v":2,"rev":7,"section":"figures-show-then-tell","title_html":"A sketch block draws a layout in text characters","title_text":"A sketch block draws a layout in text characters","text":"A sketch block draws a layout in text characters Write a sketch with box characters, as in a terminal. The page shows it as written, in one ink, with a numbered caption. An agent writes it at low cost, and it reads the same in board.org, in a diff and in the terminal. #+caption: A wide figure makes its card two columns wide on the rack #+begin_src sketch ┌─────────────────────────┐ ┌───────────┐ │ card with a wide figure │ │ card │ │ ┌─────────────────────┐ │ │ │ │ │ figure, 50 columns │ │ │ │ │ └─────────────────────┘ │ │ │ └─────────────────────────┘ └───────────┘ ┌───────────┐ ┌───────────┐ ┌───────────┐ │ card │ │ card │ │ card │ └───────────┘ └───────────┘ └───────────┘ #+end_src The source of a sketch: #+begin_example #+caption: What the figure shows, in a few words #+begin_src sketch ┌────┐ ┌────┐ │ A ├──►│ B │ └────┘ └────┘ #+end_src #+end_example - A sketch is 72 columns wide at most. A wide sketch makes its card two columns wide on the rack. - Chinese and Japanese characters do not keep the columns. Use Latin labels in a sketch. - A sketch has no colors and no markup. It shows in the ink of the card.","gist_html":"\u003cp>Write a sketch with box characters, as in a terminal. The page shows it as written, in one ink, with a numbered caption. An agent writes it at low cost, and it reads the same in board.org, in a diff and in the terminal.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"sketch\">\u003cdiv class=\"fig-body\">\u003cpre class=\"sketch\" role=\"img\" aria-label=\"Sketch: A wide figure makes its card two columns wide on the rack\">┌─────────────────────────┐ ┌───────────┐\n│ card with a wide figure │ │ card      │\n│ ┌─────────────────────┐ │ │           │\n│ │ figure, 50 columns  │ │ │           │\n│ └─────────────────────┘ │ │           │\n└─────────────────────────┘ └───────────┘\n┌───────────┐ ┌───────────┐ ┌───────────┐\n│ card      │ │ card      │ │ card      │\n└───────────┘ └───────────┘ └───────────┘\u003c/pre>\u003c/div>\u003cfigcaption>\u003cb>Fig. 29.1\u003c/b> A wide figure makes its card two columns wide on the rack\u003c/figcaption>\u003c/figure>","wide":false,"fig_w":320,"tbl_w":0,"facts":[],"depth_html":"\u003cp>The source of a sketch:\u003c/p>\u003cpre>\u003ccode>#+caption: What the figure shows, in a few words\n#+begin_src sketch\n  ┌────┐   ┌────┐\n  │ A  ├──►│ B  │\n  └────┘   └────┘\n#+end_src\u003c/code>\u003c/pre>\u003cul>\u003cli>A sketch is 72 columns wide at most. A wide sketch makes its card two columns wide on the rack.\u003c/li>\u003cli>Chinese and Japanese characters do not keep the columns. Use Latin labels in a sketch.\u003c/li>\u003cli>A sketch has no colors and no markup. It shows in the ink of the card.\u003c/li>\u003c/ul>","options":[],"ask":null,"status":"open","basis":"fact","from":["show-first"],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":1,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"A sketch block draws a layout in text characters","gist_html":"\u003cp>Write a sketch with box characters, as in a terminal. The page shows it as written, in one ink, with a numbered caption. An agent writes it at low cost, and it reads the same in board.md, in a diff and in the terminal.\u003c/p>"}]},"fig-flow":{"id":"fig-flow","n":30,"v":2,"rev":7,"section":"figures-show-then-tell","title_html":"A flow block draws boxes and arrows, and the compiler places them","title_text":"A flow block draws boxes and arrows, and the compiler places them","text":"A flow block draws boxes and arrows, and the compiler places them Write one arrow on each line, such as a -> b: label. The compiler puts the boxes in ranks, orders them to cut crossings, and draws the arrows. The agent never places a box, so the same text always gives the same picture. #+caption: The card-skill loop #+begin_src flow board.org -> cards render: agent writes cards render -> board.html board.html -> you: open you -> log.jsonl: Send log.jsonl -> agent: cards wait agent -> board.org: revise #+end_src - a -> b is an arrow. a --> b is a dashed arrow, for a later or optional step. - a -> b: label puts a label on the arrow. a -> b -> c is a chain. - a makes a bold box, for the part under discussion. - direction: right draws left to right. The default is down. - A flow has 12 boxes at most. Point at a box to darken its arrows.","gist_html":"\u003cp>Write one arrow on each line, such as \u003ccode>a -&gt; b: label\u003c/code>. The compiler puts the boxes in ranks, orders them to cut crossings, and draws the arrows. The agent never places a box, so the same text always gives the same picture.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"flow\">\u003cdiv class=\"fig-body\">\u003csvg class=\"flow\" viewBox=\"-42.9 9 222 352\" width=\"222\" height=\"352\" role=\"img\" aria-label=\"Diagram: The card-skill loop. board.org to cards render (agent writes); cards render to board.html; board.html to you (open); you to log.jsonl (Send); log.jsonl to agent (cards wait); agent to board.org (revise)\">\u003cg class=\"fe\" data-a=\"0\" data-b=\"1\">\u003cpath d=\"M53.5,50 L53.5,82 M49.5,76 L53.5,82 L57.5,76\"/>\u003ctext x=\"47.5\" y=\"62\" text-anchor=\"end\" dominant-baseline=\"central\">agent writes\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"1\" data-b=\"2\">\u003cpath d=\"M53.5,110 L53.5,140 M49.5,134 L53.5,140 L57.5,134\"/>\u003c/g>\u003cg class=\"fe\" data-a=\"2\" data-b=\"3\">\u003cpath d=\"M53.5,168 L53.5,200 M49.5,194 L53.5,200 L57.5,194\"/>\u003ctext x=\"59.5\" y=\"180\" text-anchor=\"start\" dominant-baseline=\"central\">open\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"3\" data-b=\"4\">\u003cpath d=\"M53.5,228 L53.5,260 M49.5,254 L53.5,260 L57.5,254\"/>\u003ctext x=\"59.5\" y=\"240\" text-anchor=\"start\" dominant-baseline=\"central\">Send\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"4\" data-b=\"5\">\u003cpath d=\"M53.5,288 L53.5,320 M49.5,314 L53.5,320 L57.5,314\"/>\u003ctext x=\"47.5\" y=\"300\" text-anchor=\"end\" dominant-baseline=\"central\">cards wait\u003c/text>\u003c/g>\u003cg class=\"fe back\" data-a=\"5\" data-b=\"0\">\u003cpath d=\"M53.5,348 L53.5,355 Q53.5,359 57.5,359 L121,359 Q125,359 125,355 L125,15 Q125,11 121,11 L57.5,11 Q53.5,11 53.5,15 L53.5,22 M49.5,16 L53.5,22 L57.5,16\"/>\u003ctext x=\"131\" y=\"185\" text-anchor=\"start\" dominant-baseline=\"central\">revise\u003c/text>\u003c/g>\u003cg class=\"fn strong\" data-n=\"0\" data-part=\"board.org\">\u003crect x=\"11\" y=\"22\" width=\"85\" height=\"28\" rx=\"3\"/>\u003ctext x=\"53.5\" y=\"36\" text-anchor=\"middle\" dominant-baseline=\"central\">board.org\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"1\" data-part=\"cards-render\">\u003crect x=\"0\" y=\"82\" width=\"107\" height=\"28\" rx=\"3\"/>\u003ctext x=\"53.5\" y=\"96\" text-anchor=\"middle\" dominant-baseline=\"central\">cards render\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"2\" data-part=\"board.html\">\u003crect x=\"7.5\" y=\"140\" width=\"92\" height=\"28\" rx=\"3\"/>\u003ctext x=\"53.5\" y=\"154\" text-anchor=\"middle\" dominant-baseline=\"central\">board.html\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"3\" data-part=\"you\">\u003crect x=\"29.5\" y=\"200\" width=\"48\" height=\"28\" rx=\"3\"/>\u003ctext x=\"53.5\" y=\"214\" text-anchor=\"middle\" dominant-baseline=\"central\">you\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"4\" data-part=\"log.jsonl\">\u003crect x=\"11\" y=\"260\" width=\"85\" height=\"28\" rx=\"3\"/>\u003ctext x=\"53.5\" y=\"274\" text-anchor=\"middle\" dominant-baseline=\"central\">log.jsonl\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"5\" data-part=\"agent\">\u003crect x=\"25.5\" y=\"320\" width=\"56\" height=\"28\" rx=\"3\"/>\u003ctext x=\"53.5\" y=\"334\" text-anchor=\"middle\" dominant-baseline=\"central\">agent\u003c/text>\u003c/g>\u003c/svg>\u003c/div>\u003cfigcaption>\u003cb>Fig. 30.1\u003c/b> The card-skill loop\u003c/figcaption>\u003c/figure>","wide":false,"fig_w":246,"tbl_w":0,"facts":[],"depth_html":"\u003cul>\u003cli>\u003ccode>a -&gt; b\u003c/code> is an arrow. \u003ccode>a --&gt; b\u003c/code> is a dashed arrow, for a later or optional step.\u003c/li>\u003cli>\u003ccode>a -&gt; b: label\u003c/code> puts a label on the arrow. \u003ccode>a -&gt; b -&gt; c\u003c/code> is a chain.\u003c/li>\u003cli>\u003ccode>*a*\u003c/code> makes a bold box, for the part under discussion.\u003c/li>\u003cli>\u003ccode>direction: right\u003c/code> draws left to right. The default is down.\u003c/li>\u003cli>A flow has 12 boxes at most. Point at a box to darken its arrows.\u003c/li>\u003c/ul>","options":[],"ask":null,"status":"open","basis":"fact","from":["show-first"],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":1,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"A flow block draws boxes and arrows, and the compiler places them","gist_html":"\u003cp>Write one arrow on each line, such as \u003ccode>a -&gt; b: label\u003c/code>. The compiler puts the boxes in ranks, orders them to cut crossings, and draws the arrows. The agent never places a box, so the same text always gives the same picture.\u003c/p>"}]},"ste80":{"id":"ste80","n":31,"v":1,"rev":5,"section":"writing-near-asd-ste100","title_html":"Cards follow ASD-STE100, about 80% of the way","title_text":"Cards follow ASD-STE100, about 80% of the way","text":"Cards follow ASD-STE100, about 80% of the way Karpathy suggests ASD-STE100 to make model output easier to read. We take the rules that a checker can test, and the writer keeps the rest. Write one fact in each sentence. Use active verbs in the present tense. Use the same word for the same thing. - before :: The server binds to loopback only, requires a per-run token and this server's Origin on every write, allows only its own Host names, takes board ids as slugs and never as paths, and checks every reply item by kind. (39 words) - after :: The server listens on this machine only. - :: Every write needs the page token and this Origin. - :: The server accepts only its own Host names. - :: A board id is a short name, never a path. - :: The server checks each reply item by its kind. - sentence :: 25 words at most; 20 for an instruction - paragraph :: 6 sentences at most, one topic - words :: the STE sheet list, and words that agents overuse - checked by :: cards check, as warnings The rules come from the ASD-STE100 sheet on Karpathy's post (https://x.com/karpathy/status/2105819303471976479). The full profile is in skill/reference/writing.md.","gist_html":"\u003cp>Karpathy suggests ASD-STE100 to make model output easier to read. We take the rules that a checker can test, and the writer keeps the rest. Write one fact in each sentence. Use active verbs in the present tense. Use the same word for the same thing.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"tbl_w":0,"facts":[["before","The server binds to loopback only, requires a per-run token and this server&#39;s Origin on every write, allows only its own Host names, takes board ids as slugs and never as paths, and checks every reply item by kind. (39 words)","before"],["after","The server listens on this machine only.","after"],["","Every write needs the page token and this Origin.",""],["","The server accepts only its own Host names.",""],["","A board id is a short name, never a path.",""],["","The server checks each reply item by its kind.",""],["sentence","25 words at most; 20 for an instruction","sentence"],["paragraph","6 sentences at most, one topic","paragraph"],["words","the STE sheet list, and words that agents overuse","words"],["checked by","cards check, as warnings","checked by"]],"depth_html":"\u003cp>The rules come from the ASD-STE100 sheet on Karpathy&#39;s post (\u003ca href=\"https://x.com/karpathy/status/2105819303471976479\" target=\"_blank\" rel=\"noopener noreferrer\">https://x.com/karpathy/status/2105819303471976479\u003c/a>). The full profile is in \u003ccode>skill/reference/writing.md\u003c/code>.\u003c/p>","options":[],"ask":null,"status":"open","basis":"fact","from":[],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[]},"ste-lint":{"id":"ste-lint","n":32,"v":2,"rev":7,"section":"writing-near-asd-ste100","title_html":"The checker warns on long sentences and on listed words","title_text":"The checker warns on long sentences and on listed words","text":"The checker warns on long sentences and on listed words cards check and cards render count the words in each sentence and the sentences in each paragraph. They flag words such as \"utilize\" and \"leverage\", and they give the plain word. Quotes and code do not count. A board in another language skips these checks. What the agent sees after cards render: #+begin_src text board.org:56 warn: sentence has 28 words; split it (\u003c= 25) board.org:61 warn: \"utilize\": write use (writing.md word list) ok: 24 cards, 9 sections, 2 warnings #+end_src Some rules need a person, not a checker: active voice, short noun groups, and one meaning for each word. They are in the profile as rules for the writer.","gist_html":"\u003cp>\u003ccode>cards check\u003c/code> and \u003ccode>cards render\u003c/code> count the words in each sentence and the sentences in each paragraph. They flag words such as &quot;utilize&quot; and &quot;leverage&quot;, and they give the plain word. Quotes and code do not count. A board in another language skips these checks.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"tbl_w":0,"facts":[],"depth_html":"\u003cp>What the agent sees after \u003ccode>cards render\u003c/code>:\u003c/p>\u003cpre data-lang=\"text\">\u003ccode>board.org:56  warn: sentence has 28 words; split it (&lt;= 25)\nboard.org:61  warn: &quot;utilize&quot;: write use (writing.md word list)\nok: 24 cards, 9 sections, 2 warnings\u003c/code>\u003c/pre>\u003cp>Some rules need a person, not a checker: active voice, short noun groups, and one meaning for each word. They are in the profile as rules for the writer.\u003c/p>","options":[],"ask":null,"status":"open","basis":"fact","from":["ste80"],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":1,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"The checker warns on long sentences and on listed words","gist_html":"\u003cp>\u003ccode>cards check\u003c/code> and \u003ccode>cards render\u003c/code> count the words in each sentence and the sentences in each paragraph. They flag words such as &quot;utilize&quot; and &quot;leverage&quot;, and they give the plain word. Quotes and code do not count. A board in another language skips these checks.\u003c/p>"}]},"return-channel":{"id":"return-channel","n":11,"v":3,"rev":5,"section":"replies-the-return-path","title_html":"Your replies reach the agent as files, or by copy and paste","title_text":"Your replies reach the agent as files, or by copy and paste","text":"Your replies reach the agent as files, or by copy and paste With cards serve, Send writes your reply to log.jsonl, and the agent reads it with cards wait. Without a server, Send copies the same text, and you paste it into the chat. An ask that you do not touch is reported as untouched. It is never consent. #+caption: Two paths back to the agent #+begin_src flow Send -> cards serve: served page cards serve -> log.jsonl log.jsonl -> agent: cards wait Send -> clipboard: file page clipboard -> chat: you paste chat -> agent #+end_src - The server listens on this machine only. - Every write needs the page token and the Origin of this server. - The server accepts only its own Host names. - A board id is a short name, never a path. - The server checks each reply item by its kind. A code review found three holes in the first version. Each fix has a test in test/review.test.mjs. In this container, your browser cannot reach the server. Use the file page and Copy.","gist_html":"\u003cp>With \u003ccode>cards serve\u003c/code>, Send writes your reply to \u003ccode>log.jsonl\u003c/code>, and the agent reads it with \u003ccode>cards wait\u003c/code>. Without a server, Send copies the same text, and you paste it into the chat. An ask that you do not touch is reported as untouched. It is never consent.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"flow\">\u003cdiv class=\"fig-body\">\u003csvg class=\"flow\" viewBox=\"-2 -2 240 264\" width=\"240\" height=\"264\" role=\"img\" aria-label=\"Diagram: Two paths back to the agent. Send to cards serve (served page); cards serve to log.jsonl; log.jsonl to agent (cards wait); Send to clipboard (file page); clipboard to chat (you paste); chat to agent\">\u003cg class=\"fe\" data-a=\"0\" data-b=\"1\">\u003cpath d=\"M99.3,28 L99.3,77 Q99.3,81 95.3,81 L54,81 Q50,81 50,85 L50,94 M46,88 L50,94 L54,88\"/>\u003ctext x=\"93.3\" y=\"40\" text-anchor=\"end\" dominant-baseline=\"central\">served page\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"1\" data-b=\"2\">\u003cpath d=\"M50,122 L50,154 M46,148 L50,154 L54,148\"/>\u003c/g>\u003cg class=\"fe\" data-a=\"2\" data-b=\"3\">\u003cpath d=\"M50,182 L50,215 Q50,219 54,219 L95.3,219 Q99.3,219 99.3,223 L99.3,232 M95.3,226 L99.3,232 L103.3,226\"/>\u003ctext x=\"56\" y=\"194\" text-anchor=\"start\" dominant-baseline=\"central\">cards wait\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"0\" data-b=\"4\">\u003cpath d=\"M113.3,28 L113.3,77 Q113.3,81 117.3,81 L158.5,81 Q162.5,81 162.5,85 L162.5,94 M158.5,88 L162.5,94 L166.5,88\"/>\u003ctext x=\"119.3\" y=\"40\" text-anchor=\"start\" dominant-baseline=\"central\">file page\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"4\" data-b=\"5\">\u003cpath d=\"M162.5,122 L162.5,154 M158.5,148 L162.5,154 L166.5,148\"/>\u003ctext x=\"168.5\" y=\"134\" text-anchor=\"start\" dominant-baseline=\"central\">you paste\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"5\" data-b=\"3\">\u003cpath d=\"M162.5,182 L162.5,215 Q162.5,219 158.5,219 L117.3,219 Q113.3,219 113.3,223 L113.3,232 M109.3,226 L113.3,232 L117.3,226\"/>\u003c/g>\u003cg class=\"fn\" data-n=\"0\" data-part=\"send\">\u003crect x=\"81.8\" y=\"0\" width=\"49\" height=\"28\" rx=\"3\"/>\u003ctext x=\"106.3\" y=\"14\" text-anchor=\"middle\" dominant-baseline=\"central\">Send\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"1\" data-part=\"cards-serve\">\u003crect x=\"0\" y=\"94\" width=\"100\" height=\"28\" rx=\"3\"/>\u003ctext x=\"50\" y=\"108\" text-anchor=\"middle\" dominant-baseline=\"central\">cards serve\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"2\" data-part=\"log.jsonl\">\u003crect x=\"7.5\" y=\"154\" width=\"85\" height=\"28\" rx=\"3\"/>\u003ctext x=\"50\" y=\"168\" text-anchor=\"middle\" dominant-baseline=\"central\">log.jsonl\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"3\" data-part=\"agent\">\u003crect x=\"78.3\" y=\"232\" width=\"56\" height=\"28\" rx=\"3\"/>\u003ctext x=\"106.3\" y=\"246\" text-anchor=\"middle\" dominant-baseline=\"central\">agent\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"4\" data-part=\"clipboard\">\u003crect x=\"120\" y=\"94\" width=\"85\" height=\"28\" rx=\"3\"/>\u003ctext x=\"162.5\" y=\"108\" text-anchor=\"middle\" dominant-baseline=\"central\">clipboard\u003c/text>\u003c/g>\u003cg class=\"fn\" data-n=\"5\" data-part=\"chat\">\u003crect x=\"138\" y=\"154\" width=\"49\" height=\"28\" rx=\"3\"/>\u003ctext x=\"162.5\" y=\"168\" text-anchor=\"middle\" dominant-baseline=\"central\">chat\u003c/text>\u003c/g>\u003c/svg>\u003c/div>\u003cfigcaption>\u003cb>Fig. 11.1\u003c/b> Two paths back to the agent\u003c/figcaption>\u003c/figure>","wide":false,"fig_w":264,"tbl_w":0,"facts":[],"depth_html":"\u003cul>\u003cli>The server listens on this machine only.\u003c/li>\u003cli>Every write needs the page token and the Origin of this server.\u003c/li>\u003cli>The server accepts only its own Host names.\u003c/li>\u003cli>A board id is a short name, never a path.\u003c/li>\u003cli>The server checks each reply item by its kind.\u003c/li>\u003c/ul>\u003cp>A code review found three holes in the first version. Each fix has a test in \u003ccode>test/review.test.mjs\u003c/code>. In this container, your browser cannot reach the server. Use the file page and Copy.\u003c/p>","options":[],"ask":null,"status":"open","basis":"fact","from":[],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":2,"rev":2,"at":"2026-10-09T05:36:26.523Z","title_html":"Replies reach the agent as files, not as copy-paste","gist_html":"\u003cp>With \u003ccode>cards serve\u003c/code>, Send writes a round to \u003ccode>log.jsonl\u003c/code>, and \u003ccode>cards wait\u003c/code> wakes the agent. Without a server, Send copies the same text for you to paste. An untouched ask is reported as untouched, never as consent.\u003c/p>"},{"v":1,"rev":1,"at":"2026-10-09T05:19:58.566Z","title_html":"Replies reach the agent as files, not as copy-paste","gist_html":"\u003cp>With \u003ccode>cards serve\u003c/code>, Send writes a round to \u003ccode>log.jsonl\u003c/code>, and \u003ccode>cards wait\u003c/code> wakes the agent. Without a server, Send copies the same text for you to paste. An untouched ask is reported as untouched, never as consent.\u003c/p>"}]},"ask-server":{"id":"ask-server","n":18,"v":4,"rev":7,"section":"replies-the-return-path","title_html":"Replies go through the local server when it is reachable, and by copy otherwise","title_text":"Replies go through the local server when it is reachable, and by copy otherwise","text":"Replies go through the local server when it is reachable, and by copy otherwise You confirmed this in round 1, and D8 records it. In this container your browser cannot reach the server, so round 1 came back by copy and paste.","gist_html":"\u003cp>You confirmed this in round 1, and D8 records it. In this container your browser cannot reach the server, so round 1 came back by copy and paste.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"tbl_w":0,"facts":[],"depth_html":"","options":[],"ask":null,"status":"done","basis":null,"from":["return-channel"],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":3,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"Make the local server the default return path?","gist_html":"\u003cp>The server removes copy and paste. It is one more process to keep running. It listens on this machine only, so a browser outside this container cannot reach it yet. That needs a capability URL (D12).\u003c/p>"},{"v":2,"rev":4,"at":"2026-10-09T05:37:31.743Z","title_html":"Make the local server the default return path?","gist_html":"\u003cp>The server closes the loop without copy-paste. It is one more process. It binds to loopback only, so a browser outside this container cannot reach it yet; that needs a capability URL (D12).\u003c/p>"},{"v":1,"rev":1,"at":"2026-10-09T05:19:58.566Z","title_html":"Make the local server the default return path?","gist_html":"\u003cp>The server closes the loop without copy-paste. It is one more process, and from this container the host browser needs a published port to reach it.\u003c/p>"}]},"signal-cards":{"id":"signal-cards","n":13,"v":5,"rev":7,"section":"look-the-visual-direction","title_html":"Cards look like kanban signal cards on a steel rack","title_text":"Cards look like kanban signal cards on a steel rack","text":"Cards look like kanban signal cards on a steel rack Cards are card stock on cool grey steel, in one ink. A yellow-red tab stands up only where the agent waits on you. Blue marks only your own acts and your focus. On the desk, red marks a need and violet an option. Each color has one meaning. The design roll (f3a39d30, a pool of 7) chose the Toyota kanban world. Three other worlds each gave one rule. Patent drawings gave reference numerals and figure numbers. The Munich 1972 pictograms gave one color for each role. Bamboo-slip books gave a struck line for an old version. The colors are the JIS Z 9103 safety colors from factory floors. The desk adds a dot grid, and lines in the ink, in red and in violet. The full record is in DESIGN.md.","gist_html":"\u003cp>Cards are card stock on cool grey steel, in one ink. A yellow-red tab stands up only where the agent waits on you. Blue marks only your own acts and your focus. On the desk, red marks a need and violet an option. Each color has one meaning.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"tbl_w":0,"facts":[],"depth_html":"\u003cp>The design roll (\u003ccode>f3a39d30\u003c/code>, a pool of 7) chose the Toyota kanban world. Three other worlds each gave one rule. Patent drawings gave reference numerals and figure numbers. The Munich 1972 pictograms gave one color for each role. Bamboo-slip books gave a struck line for an old version.\u003c/p>\u003cp>The colors are the JIS Z 9103 safety colors from factory ext":"The kanban look is approved You approved it in round 1, and D11 records it. Round 2 adds two line colors, each with one meaning: red for a need and violet for an option.","gist_html":"\u003cp>You approved it in round 1, and D11 records it. Round 2 adds two line colors, each with one meaning: red for a need and violet for an option.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"tbl_w":0,"facts":[],"depth_html":"","options":[],"ask":null,"status":"done","basis":null,"from":["signal-cards"],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":2,"rev":5,"at":"2026-10-09T08:18:54.613Z","title_html":"Approve the visual direction: kanban signal cards on a steel rack?","gist_html":"\u003cp>The board that you read now is the sample, in both views. If you reject it, I roll a new direction and use your reason as the brief.\u003c/p>"},{"v":1,"rev":1,"at":"2026-10-09T05:19:58.566Z","title_html":"Approve the visual direction: kanban signal cards on a steel rack?","gist_html":"\u003cp>If you reject it, I roll the direction again and take your reason as the brief.\u003c/p>"}]},"unit-of-judgment":{"id":"unit-of-judgment","n":1,"v":2,"rev":5,"section":"foundation-decided-rules","title_html":"A card is the smallest unit you can judge and point at","title_text":"A card is the smallest unit you can judge and point at","text":"A card is the smallest unit you can judge and point at Agents now write more than people can read. You can judge a wall of prose only as a whole. You can keep, drop, answer or question one card. Its numeral lets you point in words: \"card 12 is wrong\". Karpathy names the job: \"a lot more of our work will rise up the abstractions into oversight and understanding\" (https://x.com/karpathy/status/2105819303471976479). In May 2026 he asked to \"point and gesture at the screen\" (https://x.com/karpathy/status/2053872850101285137).","gist_html":"\u003cp>Agents now write more than people can read. You can judge a wall of prose only as a whole. You can keep, drop, answer or question one card. Its numeral lets you point in words: &quot;card 12 is wrong&quot;.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"tbl_w":0,"facts":[],"depth_html":"\u003cp>Karpathy names the job: &quot;a lot more of our work will rise up the abstractions into oversight and understanding&quot; (\u003ca href=\"https://x.com/karpathy/status/2105819303471976479\" target=\"_blank\" rel=\"noopener noreferrer\">https://x.com/karpathy/status/2105819303471976479\u003c/a>). In May 2026 he asked to &quot;point and gesture at the screen&quot; (\u003ca href=\"https://x.com/karpathy/status/2053872850101285137\" target=\"_blank\" rel=\"noopener noreferrer\">https://x.com/karpathy/status/2053872850101285137\u003c/a>).\u003c/p>","options":[],"ask":null,"status":"open","basis":"inference","from":[],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":1,"rev":1,"at":"2026-10-09T05:19:58.566Z","title_html":"A card is the smallest unit you can judge and point at","gist_html":"\u003cp>Agents now produce more than people can read. The human job is to judge the output. You can only judge a wall of prose as a whole. You can keep, drop, answer or question a card on its own.\u003c/p>"}]},"one-ask":{"id":"one-ask","n":2,"v":2,"rev":5,"section":"foundation-decided-rules","title_html":"Each card asks for one thing at most, and the top line says whose turn it is","title_text":"Each card asks for one thing at most, and the top line says whose turn it is","text":"Each card asks for one thing at most, and the top line says whose turn it is A card is something to read or one of three asks: choose, approve or answer. The top line counts what waits on you. The agent puts its questions in one batch, and you answer them in one pass.","gist_html":"\u003cp>A card is something to read or one of three asks: choose, approve or answer. The top line counts what waits on you. The agent puts its questions in one batch, and you answer them in one pass.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"tbl_w":0,"facts":[],"depth_html":"","options":[],"ask":null,"status":"open","basis":"inference","from":["unit-of-judgment"],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":1,"rev":1,"at":"2026-10-09T05:19:58.566Z","title_html":"Each card asks for at most one thing, and the board shows whose turn it is","gist_html":"\u003cp>A card is either something to read or one of three asks: choose, approve, answer. The top line counts what waits on you, so you never search for the questions.\u003c/p>"}]},"cards-earned":{"id":"cards-earned","n":3,"v":2,"rev":5,"section":"foundation-decided-rules","title_html":"Use a board only when cards earn it; most replies stay prose","title_text":"Use a board only when cards earn it; most replies stay prose","text":"Use a board only when cards earn it; most replies stay prose Use a board for three or more separate judgments, for a decision that only you can make, or for work across turns. One explanation is a paragraph, not a board. The checker warns at more than five open asks.","gist_html":"\u003cp>Use a board for three or more separate judgments, for a decision that only you can make, or for work across turns. One explanation is a paragraph, not a board. The checker warns at more than five open asks.\u003c/p>","figure_html":"","wide":false,"fig_w":0,"tbl_w":0,"facts":[],"depth_html":"","options":[],"ask":null,"status":"open","basis":"inference","from":[],"needs":[],"when":{},"refs":[],"tags":[],"sheet":false,"on":[],"multi":false,"suggest":null,"progress":null,"history":[{"v":1,"rev":1,"at":"2026-10-09T05:19:58.566Z","title_html":"Cards are earned; most agent replies stay prose","gist_html":"\u003cp>Use a board for several separate judgments, for a decision only the human can make, or for work that spans turns. One explanation is a paragraph or a page, not a board.\u003c/p>"}]},"five-primitives":{"id":"five-primitives","n":4,"v":2,"rev":5,"section":"foundation-decided-rules","title_html":"Five primitives carry the whole system","title_text":"Five primitives carry the whole system","text":"Five primitives carry the whole system The five primitives are board, section, card, link and response. A revision is not a primitive. The compiler finds revisions on every render. #+caption: How the five primitives fit #+begin_src flow board -> section: holds, in order section -> card: holds, in order card -> other card: link card -> response: your mark or answer #+end_src","gist_html":"\u003cp>The five primitives are board, section, card, link and response. A revision is not a primitive. The compiler finds revisions on every render.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"flow\">\u003cdiv class=\"fig-body\">\u003csvg class=\"flow\" viewBox=\"-2 -2 255 246\" width=\"255\" height=\"246\" role=\"img\" aria-label=\"Diagram: How the five primitives fit. board to section (holds, in order); section to card (holds, in order); card to other card (link); card to response (your mark or answer)\">\u003cg class=\"fe\" data-a=\"0\" data-b=\"1\">\u003cpath d=\"M98.5,28 L98.5,60 M94.5,54 L98.5,60 L102.5,54\"/>\u003ctext x=\"104.5\" y=\"40\" text-anchor=\"start\" dominant-baseline=\"central\">holds, in order\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"1\" data-b=\"2\">\u003cpath d=\"M98.5,88 L98.5,120 M94.5,114 L98.5,120 L102.5,114\"/>\u003ctext x=\"104.5\" y=\"100\" text-anchor=\"start\" dominant-baseline=\"central\">holds, in order\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"2\" data-b=\"3\">\u003cpath d=\"M91.5,148 L91.5,197 Q91.5,201 87.5,201 L50,201 Q46,201 46,205 L46,214 M42,208 L46,214 L50,208\"/>\u003ctext x=\"85.5\" y=\"160\" text-anchor=\"end\" dominant-baseline=\"central\">link\u003c/text>\u003c/g>\u003cg class=\"fe\" data-a=\"2\" data-b=\"4\">\u003cpath d=\" n every render.\u003c/p>"}]},"altitude":{"id":"altitude","n":5,"v":2,"rev":5,"section":"foundation-decided-rules","title_html":"Zoom changes the level of detail, not the size of the text","title_text":"Zoom changes the level of detail, not the size of the text","text":"Zoom changes the level of detail, not the size of the text The heading is the claim. The first paragraph is the gist. The rest is depth. Claim, Gist and Full in the toolbar show one, two or three levels. #+caption: One card at three levels #+begin_src sketch Claim Gist Full ┌─────────┐ ┌─────────┐ ┌─────────┐ │ claim │ │ claim │ │ claim │ └─────────┘ │ gist │ │ gist │ │ figure │ │ figure │ │ facts │ │ facts │ │ ask │ │ ask │ └─────────┘ │ depth │ │ history │ └─────────┘ #+end_src More on a card asks the agent to go deeper on that card. The interactive page can still \"explain at the wrong level of abstraction\" (@eliebakouch, in https://x.com/karpathy/status/2105819303471976479).","gist_html":"\u003cp>The heading is the claim. The first paragraph is the gist. The rest is depth. Claim, Gist and Full in the toolbar show one, two or three levels.\u003c/p>","figure_html":"\u003cfigure class=\"fig\" data-kind=\"sketch\">\u003cdiv class=\"fig-body\">\u003cpre class=\"sketch\" role=\"img\" aria-label=\"Sketch: One card at three levels\"> Claim          Gist           Full\n┌─────────┐   ┌─────────┐   ┌─────────┐\n│ claim   │   │ claim   │   │ claim   │\n└─────────┘   │ gist    │   │ gist    │\n              │ figure  │   │ figure  │\n              │ facts   │   │ facts   │\n              │ ask     │   │ ask     │\n              └─────────┘   │ depth   │\n                            │ history │\n                            └─────────┘\u003c/pre>\u003c/div>\u003cfigcaption>\u003cb>Fig. 5.1\u003c/b> One card at three levels\u003c/figcaption>\u003c/figure>","wide":false,"fig_w":305,"tbl_w":0,"facts":[],"depth_html":"\u003cp>More on a card asks the agent to go deeper on that card. The interactive page can still &
