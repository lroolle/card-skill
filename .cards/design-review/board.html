<title>card-skill design, round 2</title>
<style>/* board.css -- the card-skill design language. Every value is a token.
 *
 * Materials (provenance in DESIGN.md, in the source repo): galvanized steel rack, card stock,
 * one printed ink, JIS Z 9103 safety colors for meaning only:
 * yellow-red = the agent is waiting on you; blue = your own act and focus.
 */

:root {
  --bg:          oklch(0.948 0.005 245);  /* steel rack */
  --surface:     oklch(0.995 0.003 95);   /* card stock, faint warm cast */
  --surface-2:   oklch(0.972 0.004 95);   /* card stock, inset */
  --fg:          oklch(0.235 0.014 260);  /* printed ink */
  --fg-2:        oklch(0.43 0.012 260);
  --fg-3:        oklch(0.53 0.010 260);
  --line:        oklch(0.885 0.006 245);
  --line-strong: oklch(0.78 0.008 245);
  --signal:      oklch(0.72 0.16 55);     /* JIS yellow-red: waiting on you */
  --signal-ink:  oklch(0.235 0.014 260);
  --signal-soft: oklch(0.955 0.035 60);
  --accent:      oklch(0.47 0.135 258);   /* JIS blue: your act, focus */
  --accent-fg:   oklch(0.99 0.003 95);
  --accent-soft: oklch(0.945 0.025 258);
  --danger:      oklch(0.53 0.17 27);    /* blocked; on the desk, a "needs" line */
  --ok:          oklch(0.50 0.11 150);
  --link-option: oklch(0.50 0.15 300);   /* violet: an option of a decision, on the desk */
  --mask-show:   oklch(1 0 0);           /* a mask is luminance, not a theme color: these two stay put in dark mode */
  --mask-faint:  oklch(0.42 0 0);
  --shadow:      oklch(0.235 0.014 260 / 0.16);

  /* --cjk is the subset of an open font that a Chinese, Japanese or Korean board
     carries (lib/font.mjs sets it to the face's own name). It covers CJK characters
     only. Where the page carries none, the name matches no font and the stack goes on. */
  --cjk: "Cards CJK";
  --font: var(--cjk), system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", "Noto Sans Mono", var(--cjk), monospace;
  --t-xs: 12px;  --t-s: 13px;  --t-m: 15px;  --t-l: 17px;  --t-xl: 20px;  --t-xxl: 28px;
  --w-regular: 400;  --w-strong: 600;

  --r: 6px;      /* cards, controls, tabs */
  --r-in: 4px;   /* nested inside --r with 2px of padding: concentric */
  --r-s: 3px;    /* marks smaller than text: lamp, meter, checkbox, code */
  --s1: 4px;  --s2: 8px;  --s3: 12px;  --s4: 16px;  --s5: 24px;  --s6: 32px;  --s7: 48px;
  --card-min: 300px;
  --tab-h: 20px;
  --desk-col: 288px;       /* one section, one column on the desk; wider when a figure needs it */
  --desk-gutter: 96px;     /* room for the lines between columns */
  --ease: cubic-bezier(.2, .7, .2, 1);
  --fast: 140ms;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:          oklch(0.185 0.008 250);
    --surface:     oklch(0.238 0.008 250);
    --surface-2:   oklch(0.212 0.008 250);
    --fg:          oklch(0.935 0.006 95);
    --fg-2:        oklch(0.78 0.008 250);
    --fg-3:        oklch(0.68 0.008 250);
    --line:        oklch(0.32 0.008 250);
    --line-strong: oklch(0.43 0.010 250);
    --signal:      oklch(0.76 0.15 58);
    --signal-ink:  oklch(0.20 0.012 260);
    --signal-soft: oklch(0.30 0.05 55);
    --accent:      oklch(0.74 0.12 255);
    --accent-fg:   oklch(0.18 0.012 260);
    --accent-soft: oklch(0.31 0.05 258);
    --danger:      oklch(0.70 0.15 27);
    --ok:          oklch(0.72 0.12 150);
    --link-option: oklch(0.74 0.12 300);
    --shadow:      oklch(0.10 0.012 260 / 0.5);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding: var(--s5) 0 96px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: var(--w-regular) var(--t-m)/1.55 var(--font);
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
:lang(zh), :lang(ja), :lang(ko) { --leading-body: 1.75; line-height: var(--leading-body); }
/* Chinese and Japanese have no italics; a browser slants the glyphs instead.
   Emphasis is a dot under each character, as in print. */
:lang(zh) pre, :lang(ja) pre { line-height: 1.5; }
:lang(zh) em, :lang(ja) em { font-style: normal; text-emphasis: filled dot; text-emphasis-position: under right; }
::selection { background: var(--accent-soft); }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.noscript { max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; }

/* ---------- page ---------- */

.page { max-width: 1280px; margin: 0 auto; padding: var(--s6) var(--s6) 140px; }
.andon {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2) var(--s4);
  font-size: var(--t-s); color: var(--fg-2);
}
.lamp { display: inline-flex; align-items: center; gap: var(--s2); font-weight: var(--w-strong); color: var(--fg); }
.lamp i { width: 10px; height: 10px; border-radius: var(--r-s); border: 1.5px solid var(--fg-3); }
.lamp[data-turn="you"] i { background: var(--signal); border-color: var(--signal); }
.lamp[data-turn="ready"] i { background: var(--accent); border-color: var(--accent); }
.lamp[data-turn="agent"] i { border-color: var(--fg-3); }
.andon .stat { color: var(--fg-3); }
.andon .path { font-family: var(--mono); font-size: var(--t-xs); color: var(--fg-3); }
/* The mark: a card with its tab, at the head of the page. Its tab takes the
   signal color while an ask waits on you, as the browser tab's icon does. */
/* 24px to hit, 16px to see: the margin takes the difference back, so the line keeps its height. */
.mark { display: inline-grid; place-items: center; width: 24px; height: 24px; order: 9; margin: -4px -4px -4px auto; color: var(--fg-2); }
.mark:hover { color: var(--fg); }
.mark path { fill: currentColor; }
.mark.lit .mark-tab { fill: var(--signal); }
/* The way back to the list of boards. */
.andon .home { color: var(--fg-2); text-underline-offset: 3px; }
/* The same board in other languages: plain links, the current one in ink. */
.langs { display: inline-flex; gap: var(--s3); }
.langs a { color: var(--fg-2); text-underline-offset: 3px; }
.langs b { color: var(--fg); font-weight: var(--w-strong); }
.notice {
  margin-top: var(--s3); padding: var(--s2) var(--s3); border-radius: var(--r);
  background: var(--surface-2); color: var(--danger); font-size: var(--t-s);
}

h1.title {
  margin: var(--s3) 0 0; max-width: 34em;
  font-size: var(--t-xxl); line-height: 1.2; font-weight: var(--w-strong); letter-spacing: -0.01em;
  text-wrap: balance;
}
/* The andon rail: the real tabs, one per open ask, under the title. */
/* The rack rule: one steel rail under the lede. The ask tabs stand on it,
   in the same shape as the tab on each card. */
.rail {
  display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--s1) 6px;
  margin-top: var(--s5); border-bottom: 2px solid var(--line-strong);
}
.rail-tab {
  display: inline-flex; align-items: center; gap: var(--s2); min-height: 30px; padding: 0 var(--s3) 0 var(--s2); margin-bottom: -2px;
  border: 1px solid var(--signal); border-bottom: 2px solid var(--signal); border-radius: var(--r) var(--r) 0 0;
  background: var(--signal); color: var(--signal-ink);
  font-size: var(--t-s); font-weight: var(--w-strong); cursor: pointer;
}
.rail-tab .ref-n { border-color: currentColor; color: inherit; }
.rail-tab:hover { background: var(--signal-soft); color: var(--fg); }
.rail-tab[data-answered] { background: var(--surface); border-color: var(--accent); color: var(--accent); }
.lede { max-width: 68ch; margin-top: var(--s3); color: var(--fg-2); }
.lede p { margin: 0 0 var(--s2); }

/* ---------- shelves (sections) ---------- */

.shelf { margin-top: var(--s7); }
.shelf-head { display: flex; align-items: baseline; gap: var(--s3); }
.shelf-head h2 { margin: 0; font-size: var(--t-m); font-weight: var(--w-strong); white-space: nowrap; }
.shelf-head .count { font-size: var(--t-s); color: var(--fg-3); }
.shelf-head::after { content: ""; flex: 1; border-bottom: 1px solid var(--line-strong); transform: translateY(-4px); }
.shelf-note { max-width: 68ch; margin-top: var(--s1); font-size: var(--t-s); color: var(--fg-2); }
.shelf-note p { margin: 0; }

.slots {
  display: grid; align-items: start;
  grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
  gap: calc(var(--s5) + var(--tab-h) / 2) var(--s4);
  margin-top: calc(var(--s4) + var(--tab-h));
}
.slots[data-layout="compare"] { grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); }
.slots[data-layout="list"] { grid-template-columns: minmax(0, 1fr); max-width: 860px; gap: calc(var(--s3) + var(--tab-h)) 0; }

/* ---------- the card ---------- */

.card {
  position: relative; display: flex; flex-direction: column; gap: var(--s2);
  min-width: 0; padding: var(--s3) var(--s4) var(--s2);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  transition: opacity var(--fast) var(--ease), border-color var(--fast) var(--ease), box-shadow var(--fast) var(--ease);
  cursor: default;
}
.card:hover { border-color: var(--line-strong); }
.card.focused { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.card:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.board.focusing .card:not(.focused):not(.lit) { background: var(--surface-2); border-color: var(--line); }
.board.focusing .card:not(.focused):not(.lit) :is(.claim, .gist, .lbl, dd, .depth) { color: var(--fg-3); }
.card.lit { border-color: var(--line-strong); box-shadow: 0 0 0 1px var(--accent-soft); }
.card.flash { animation: flash 1.2s var(--ease); }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--accent-soft); border-color: var(--accent); } }

.tab {
  position: absolute; left: var(--s3); bottom: 100%; height: var(--tab-h);
  margin-bottom: -1px; padding: 0 var(--s2);
  display: inline-flex; align-items: center; gap: var(--s1);
  font-size: var(--t-xs); font-weight: var(--w-strong); line-height: 1;
  background: var(--signal); color: var(--signal-ink);
  border: 1px solid var(--signal); border-bottom: 0;
  border-radius: var(--r) var(--r) 0 0;
}
.card[data-answered] .tab { background: var(--surface); color: var(--accent); border-color: var(--accent); }
/* A held ask is not yours yet: its tab is paper with a dashed edge, not the signal. */
.card[data-held] .tab, .rail-tab[data-held] { background: var(--surface); color: var(--fg-2); border-color: var(--line-strong); border-style: dashed; }
.card.focused .tab { border-color: var(--accent); }
.card[data-answered].focused .tab { border-color: var(--accent); }

.addr { display: flex; align-items: center; gap: var(--s2); min-height: 18px; font-size: var(--t-xs); color: var(--fg-3); }
.addr .rel:not(:empty) { padding: 0 5px; border: 1px solid var(--accent); border-radius: var(--r-s); color: var(--accent); font-weight: var(--w-strong); }
.addr .stamp:not(:empty) { padding: 0 5px; border-radius: var(--r-s); background: var(--accent-soft); color: var(--accent); font-weight: var(--w-strong); }
.addr .chg { color: var(--fg); font-weight: var(--w-strong); }
.addr .st-doing { color: var(--fg); font-weight: var(--w-strong); }
.addr .st-blocked { color: var(--danger); font-weight: var(--w-strong); }
.addr .tags { color: var(--fg-3); }
.grip {
  width: 26px; height: 26px; display: grid; place-items: center;
  border: 0; background: none; border-radius: var(--r-in); color: var(--fg-3); cursor: grab; touch-action: none;
}
.grip:hover { background: var(--surface-2); color: var(--fg); }
.grip:disabled { cursor: default; opacity: 0.5; }
.card.dragging { opacity: 0.6; cursor: grabbing; }

.claim { margin: 0; font-size: var(--t-l); line-height: 1.35; font-weight: var(--w-strong); text-wrap: pretty; overflow-wrap: anywhere; }
.claim code { font-size: 0.88em; }
.gist { color: var(--fg-2); overflow-wrap: anywhere; }
.gist p { margin: 0; }

.meter { height: 3px; background: var(--line); border-radius: var(--r-s); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--fg); }

dl.facts { display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); margin: var(--s1) 0 0; font-size: var(--t-s); }
dl.facts dt, dl.facts dd { margin: 0; padding: 5px 0; border-top: 1px solid var(--line); }
dl.facts dt { padding-right: var(--s4); color: var(--fg-3); }
dl.facts dd { color: var(--fg); overflow-wrap: anywhere; }
dl.facts .blank { color: var(--fg-3); }

/* ---------- asks ---------- */

.ask { display: flex; flex-direction: column; gap: var(--s1); margin-top: var(--s1); }
.opt {
  display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; align-items: start; gap: var(--s2);
  padding: 6px var(--s2); margin: 0 calc(var(--s2) * -1);
  border-radius: var(--r); cursor: pointer;
}
.opt:hover { background: var(--surface-2); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .dot {
  width: 16px; height: 16px; margin-top: 2px; border-radius: 50%;
  border: 1.5px solid var(--line-strong); display: grid; place-items: center;
}
.opt[data-multi] .dot { border-radius: var(--r-s); }
.opt.suggested .dot { border-style: dashed; border-color: var(--fg-2); }
.opt.on .dot { border: 5px solid var(--accent); }
.opt[data-multi].on .dot { border: 0; background: var(--accent); }
.opt[data-multi].on .dot::after { content: ""; width: 8px; height: 4px; border: 2px solid var(--accent-fg); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.opt input:focus-visible + .dot { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt .lbl { overflow-wrap: anywhere; }
.opt .lbl .ref-n { margin-right: var(--s2); }
.opt .opt-note { color: var(--fg-3); }
.opt .hint { font-size: var(--t-xs); color: var(--fg-3); padding-top: 3px; }
.opt.on .hint { color: var(--accent); }

.ask.gate { flex-direction: row; flex-wrap: wrap; gap: var(--s2); }
/* An ask that waits for another ask: the reason in words, the controls shown and off. */
.gate-note, .ask-note { flex: 1 0 100%; margin: 0 0 var(--s1); font-size: var(--t-s); color: var(--fg-2); }
.gate-note .ref-n { vertical-align: baseline; }
/* The way out stands after the sentence with a gap of its own: a typed space would be wrong after a Chinese full stop. */
.gate-note button[data-act] { margin-left: var(--s2); }
/* The card numeral in the note is a button: it gets a target of 24px. */
.gate-note button[data-goto] { display: inline-grid; place-items: center; min-width: 24px; min-height: 24px; vertical-align: middle; text-decoration: none; }
/* Under a finger both small controls get 44px to hit, without a larger look: the padding is taken back by the margin. */
@media (max-width: 720px), (pointer: coarse) {
  .mark { box-sizing: content-box; padding: 10px; margin: -10px -10px -10px auto; }
  .gate-note button[data-goto] { box-sizing: content-box; padding: 10px; margin: -10px; }
}
.ask.held :is(.opt, .btn, textarea) { opacity: 0.5; cursor: not-allowed; }
.ask.held .opt:hover { background: none; }
button.link { padding: 0; border: 0; background: none; color: var(--accent); font: inherit; font-weight: var(--w-strong); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.btn {
  min-height: 32px; padding: 0 var(--s3);
  border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface);
  font-size: var(--t-s); font-weight: var(--w-strong); cursor: pointer;
}
.btn:hover { border-color: var(--fg-3); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.reject[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); color: var(--surface); }

textarea {
  width: 100%; min-height: 64px; resize: vertical; padding: var(--s2) var(--s3);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r);
  font-size: var(--t-m); line-height: 1.5;
}
textarea:focus { outline: none; border-color: var(--accent); background: var(--surface); }
textarea::placeholder { color: var(--fg-3); }

/* ---------- depth ---------- */

.depth { font-size: var(--t-m); line-height: 1.6; overflow-wrap: anywhere; }
.depth > :first-child { margin-top: var(--s1); }
.depth p, .depth ul, .depth ol, .depth blockquote, .depth pre, .depth .table, .depth dl { margin: 0 0 var(--s3); }
.depth ul, .depth ol { padding-left: 1.25em; }
.depth li + li { margin-top: 2px; }
.depth h4 { margin: var(--s4) 0 var(--s1); font-size: var(--t-s); font-weight: var(--w-strong); }
.depth blockquote { padding-left: var(--s3); border-left: 1px solid var(--line-strong); color: var(--fg-2); }
.depth hr { border: 0; border-top: 1px solid var(--line); margin: var(--s4) 0; }
.depth li.task { list-style: none; margin-left: -1.25em; display: flex; gap: var(--s2); }
.depth li.task .box { flex: none; width: 14px; height: 14px; margin-top: 4px; border: 1.5px solid var(--line-strong); border-radius: var(--r-s); font-size: 10px; line-height: 11px; text-align: center; }
.depth li.task.checked > span:last-child { color: var(--fg-3); text-decoration: line-through; }
code { font-family: var(--mono); font-size: 0.86em; background: var(--surface-2); border-radius: var(--r-s); padding: 1px 4px; }
pre { overflow-x: auto; padding: var(--s3); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r); font-size: var(--t-s); line-height: 1.5; }
pre code { background: none; padding: 0; font-size: inherit; }
pre.diff .add { color: var(--ok); }
pre.diff .del { color: var(--danger); }
pre.diff .hunk { color: var(--fg-3); }
.table { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: var(--t-s); }
th, td { text-align: left; padding: 6px var(--s3) 6px 0; border-top: 1px solid var(--line); vertical-align: top; }
th { color: var(--fg-3); font-weight: var(--w-strong); border-top: 0; }
ul.tradeoffs { list-style: none; padding: 0; }
ul.tradeoffs li { display: flex; gap: var(--s2); }
ul.tradeoffs .sign { flex: none; width: 1em; font-weight: var(--w-strong); color: var(--fg-3); }
ul.tradeoffs .pro .sign { color: var(--ok); }
ul.tradeoffs .con .sign { color: var(--danger); }

/* ---------- figures: a card shows the shape it talks about ---------- */

/* A figure is a drawing on the card, in the card's one ink. Patent-sheet
   lettering: "Fig. 12.1" is an address, like a card numeral. */
.fig { display: flex; flex-direction: column; margin: var(--s1) 0 0; min-width: 0; }
.depth .fig { margin: 0 0 var(--s3); }
.fig-body {
  flex: 1; overflow-x: auto; padding: var(--s3);
  border: 1px solid var(--line); border-radius: var(--r-in);
  /* A drawing wider than its frame shows a shade at the edge that has more; the shade goes when you reach it. */
  background:
    linear-gradient(to right, var(--surface) 40%, transparent) left / 24px 100% no-repeat local,
    linear-gradient(to left, var(--surface) 40%, transparent) right / 24px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, var(--shadow), transparent) left / 10px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent) right / 10px 100% no-repeat scroll,
    var(--surface);
}
.fig figcaption { margin-top: var(--s1); font-size: var(--t-xs); color: var(--fg-2); }
.fig figcaption b { margin-right: var(--s1); color: var(--fg); font-weight: var(--w-strong); }
pre.sketch {
  margin: 0; padding: 0; overflow: visible; background: none; border: 0; border-radius: 0;
  font: var(--w-regular) var(--t-xs)/normal var(--mono); color: var(--fg); width: max-content;
}
svg.flow { display: block; overflow: visible; }
.flow text { font-family: var(--mono); font-size: var(--t-xs); fill: var(--fg); }
.flow .fn rect { fill: var(--surface); stroke: var(--fg-3); stroke-width: 1; }
.flow .fn:hover rect { stroke: var(--fg); }
.flow .fn.strong rect { stroke: var(--fg); stroke-width: 2; }
.flow .fn.strong text { font-weight: var(--w-strong); }
.flow .fe path { fill: none; stroke: var(--fg-3); stroke-width: 1.25; stroke-linejoin: round; stroke-linecap: round; }
.flow .fe.dash path { stroke-dasharray: 4 3; }
.flow .fe text { fill: var(--fg-2); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
.flow .fe.hot path { stroke: var(--fg); stroke-width: 1.75; }
.flow .fe.hot text { fill: var(--fg); }

/* ---------- files: an image, an excerpt, a chip ---------- */

/* An image is a figure: it fills its frame edge to edge, and opens full size
   in the page. The file name and pixel size sit in the caption, as a source line. */
.fig[data-kind="image"] .fig-body { padding: 0; overflow: hidden; background: var(--surface-2); }
.fig-zoom { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: zoom-in; }
.fig-zoom img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
.fig-zoom:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.fig-file { margin-left: var(--s1); font-family: var(--mono); color: var(--fg-3); white-space: nowrap; }

/* An excerpt is the file, not a retelling: its path, its range, its line numbers. */
.excerpt { margin: 0 0 var(--s3); min-width: 0; }
.excerpt figcaption { display: flex; flex-wrap: wrap; gap: 0 var(--s2); margin-bottom: var(--s1); font-size: var(--t-xs); color: var(--fg-2); }
.excerpt-src { font-family: var(--mono); color: var(--fg); overflow-wrap: anywhere; }
.excerpt-range { color: var(--fg-3); }
.excerpt pre { margin: 0; font-size: var(--t-xs); }
.excerpt pre .ln {
  display: inline-block; min-width: var(--ln, 2ch); margin-right: var(--s3);
  text-align: right; color: var(--fg-3); user-select: none;
}
.excerpt-more > pre { margin-top: calc(-1 * var(--s3) + 1px); border-top: 0; border-radius: 0 0 var(--r) var(--r); }
.excerpt-more:not([open]) > summary { margin-top: var(--s1); }
.excerpt-more[open] > summary { margin-bottom: var(--s3); }
.excerpt-more > summary { font-size: var(--t-xs); color: var(--fg-2); cursor: pointer; }
.excerpt-more > summary:hover { color: var(--fg); }
.excerpt:has(.excerpt-more[open]) > pre { border-bottom: 0; border-radius: var(--r) var(--r) 0 0; }

/* Any other file: what it is and how big, one click from disk. */
.file { margin: 0 0 var(--s3); }
.file-chip {
  display: inline-flex; align-items: baseline; gap: var(--s2); max-width: 100%;
  padding: var(--s1) var(--s2); border: 1px solid var(--line); border-radius: var(--r-in);
  background: var(--surface-2); color: var(--fg); font-size: var(--t-xs); text-decoration: none;
}
a.file-chip:hover { border-color: var(--line-strong); }
.file-ext { font-weight: var(--w-strong); letter-spacing: .04em; color: var(--fg-2); }
.file-name { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.file-size { color: var(--fg-3); white-space: nowrap; }
.file-chip.missing { color: var(--fg-3); border-style: dashed; }

/* Full size, in the page: the image fits the window; a click shows its real
   pixels, and the window scrolls. Esc or Close returns to the card. */
dialog.lightbox {
  width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0;
  border: 0; background: transparent; color: var(--fg);
}
dialog.lightbox::backdrop { background: var(--bg); }
.lightbox-frame { display: flex; flex-direction: column; height: 100%; }
.lightbox-view { flex: 1; min-height: 0; overflow: auto; display: flex; align-items: center; justify-content: center; padding: var(--s5); }
/* A flex item of a definite height: max-height: 100% holds for a tall image too. */
.lightbox-view img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; cursor: zoom-in; box-shadow: 0 1px 2px var(--shadow), 0 8px 24px var(--shadow); }
.lightbox.actual .lightbox-view { align-items: flex-start; justify-content: flex-start; }
.lightbox.actual .lightbox-view img { max-width: none; max-height: none; cursor: zoom-out; }
.lightbox-bar {
  display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s4);
  border-top: 1px solid var(--line); background: var(--surface); font-size: var(--t-s);
}
.lightbox-bar .lightbox-cap { flex: 1; min-width: 0; color: var(--fg-2); }
.lightbox-bar .lightbox-cap b { margin-right: var(--s1); color: var(--fg); font-weight: var(--w-strong); }
.lightbox-bar button { min-height: 44px; padding: 0 var(--s4); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--fg); font: inherit; cursor: pointer; }
.lightbox-bar button:hover { border-color: var(--line-strong); }
.lightbox-bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* A card whose first figure is wide takes two columns on the rack, when two fit. */
@media (min-width: 721px) {
  .view-rack .slots[data-layout="grid"] > .card.wide { grid-column: span 2; }
}

/* references: a numeral is an address you can follow */
a.ref {
  display: inline-flex; align-items: baseline; gap: var(--s1); max-width: 100%;
  text-decoration: none; border-bottom: 1px solid var(--line-strong);
}
a.ref:hover { border-bottom-color: var(--accent); color: var(--accent); }
a.ref .ref-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 22ch; }
.ref-n {
  display: inline-block; min-width: 1.5em; padding: 0 4px; border: 1px solid var(--line-strong); border-radius: var(--r);
  font-size: var(--t-xs); font-weight: var(--w-strong); line-height: 16px; text-align: center; color: var(--fg);
}
.ref.missing { color: var(--danger); }

/* ---------- context, history, thread ---------- */

.context { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s3); padding-top: var(--s2); border-top: 1px solid var(--line); font-size: var(--t-xs); color: var(--fg-3); }
.context span { display: inline-flex; align-items: center; gap: var(--s1); }
.context button { border: 0; padding: 0; background: none; cursor: pointer; }
.context button:hover .ref-n { border-color: var(--accent); color: var(--accent); }

.history { font-size: var(--t-s); color: var(--fg-3); }
.history summary { cursor: pointer; width: max-content; }
.history ol { list-style: none; padding: 0; margin: var(--s2) 0 0; display: flex; flex-direction: column; gap: var(--s2); }
.history del { color: var(--fg-2); text-decoration-color: var(--fg-3); }
.history .past-gist { margin-top: 2px; color: var(--fg-3); }
.history .past-gist p { margin: 0; }

.thread { display: flex; flex-direction: column; gap: var(--s1); font-size: var(--t-s); color: var(--fg-2); }
.said { display: flex; gap: var(--s2); align-items: baseline; }
.said b { flex: none; font-size: var(--t-xs); color: var(--accent); font-weight: var(--w-strong); }

/* ---------- card footer: marks ---------- */

/* Marks live on the card's own header strip and appear with the card under
   pointer or focus; a chosen mark stays as a stamp in the address line. */
.acts {
  position: absolute; top: 4px; right: 4px; z-index: 1;
  display: none; align-items: center; gap: 2px; padding: 1px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
}
.card:hover .acts, .card:focus-within .acts, .card.focused .acts { display: flex; }
.act {
  min-height: 26px; padding: 0 var(--s2); border: 0; border-radius: var(--r-in); background: none;
  font-size: var(--t-xs); font-weight: var(--w-strong); color: var(--fg-3); cursor: pointer;
}
.act:hover { color: var(--fg); background: var(--surface-2); }
.act[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
.reply { margin-top: var(--s1); }

/* ---------- altitude: semantic zoom ---------- */

.alt-claim .card:not(.open) :is(.gist, .fig, .facts, .ask, .depth, .thread, .history, .meter) { display: none; }
.alt-gist .card:not(.open) :is(.depth, .history) { display: none; }
/* On the desk a picture shows at every level: at Claim it is a thumbnail under
   the claim, so a board made to look and pick opens on what there is to see. */
.view-desk.alt-claim .card:not(.open):not([data-status="done"]) > .fig[data-kind="image"] { display: flex; margin-top: var(--s2); }
.view-desk.alt-claim .card:not(.open) > .fig[data-kind="image"] figcaption { display: none; }
.view-desk.alt-claim .card:not(.open) > .fig[data-kind="image"] img { max-height: 132px; width: auto; }
.card:not(.focused) .context { display: none; }

/* Claim altitude on the rack is an index: one ruled row per card, so density really changes.
   On the desk, the same altitude makes small tiles. */
.view-rack.alt-claim .slots, .view-rack.alt-claim .slots[data-layout] {
  grid-template-columns: minmax(0, 1fr); gap: 0; max-width: none; margin-top: var(--s3);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
}
.view-rack.alt-claim .card:not(.open) {
  flex-direction: row; align-items: baseline; gap: var(--s3); padding: 7px var(--s3);
  background: transparent; border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
}
.view-rack.alt-claim .card:not(.open):last-child { border-bottom: 0; }
.view-rack.alt-claim .card:not(.open) .addr { display: contents; }
.view-rack.alt-claim .card:not(.open) .claim { order: 1; flex: 1; min-width: 0; font-size: var(--t-m); }
.view-rack.alt-claim .card:not(.open) .addr > :not(.n) { order: 2; font-size: var(--t-xs); }
.view-rack.alt-claim .card:not(.open) .tab { position: static; order: 3; margin: 0; height: 20px; border-bottom: 1px solid; border-radius: var(--r-s); }
.view-rack.alt-claim .card:not(.open) .acts { top: 3px; }
.view-rack.alt-claim .card.open { margin: calc(var(--tab-h) + var(--s3)) var(--s3) var(--s3); }
.view-rack.alt-claim .card.focused:not(.open) { box-shadow: inset 0 0 0 2px var(--accent); }

/* settled work recedes */
.card[data-status="done"] { background: var(--surface-2); border-style: dashed; }
.card[data-status="done"]:not(.open) :is(.gist, .fig, .facts, .ask, .depth, .history, .meter) { display: none; }
.card[data-status="done"] .claim { color: var(--fg-2); font-weight: var(--w-regular); }

/* ---------- the desk ---------- */

/* The cards laid out on a table. In the desk view the page is the window:
   header, the desk bar (line key, zoom, arrange), then the table, which pans
   and zooms inside itself. The plane carries the dot grid, so the grid zooms
   with the cards and a moved card snaps to the dots. */
.board.view-desk {
  max-width: none; height: 100vh; height: 100dvh; padding-bottom: 0;
  display: flex; flex-direction: column; overflow: hidden;
}
.view-desk > header { flex: none; }
/* On the desk the header is compact, so the table gets the height: a smaller
   title, and the lede on two lines until you click it. */
.view-desk h1.title { margin-top: var(--s2); font-size: var(--t-xl); }
.view-desk .lede {
  margin-top: var(--s1); cursor: pointer;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden;
}
.view-desk .lede.full { display: block; }
.view-desk .lede p { margin: 0; }
.view-desk .rail { margin-top: var(--s3); }
.desk-bar {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s2) var(--s4);
  padding: var(--s2) 0; font-size: var(--t-xs); color: var(--fg-2);
}
.desk-bar .legend { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); }
.desk-bar .lg { display: inline-flex; align-items: center; gap: 6px; }
.desk-tools { display: flex; align-items: center; gap: var(--s2); }
.desk-tools .zoom-now { min-width: 3.5em; text-align: right; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.desk-tools .btn { min-height: 30px; }
.desk-tools .btn:disabled { color: var(--fg-3); cursor: default; }

.view-desk .shelves {
  position: relative; flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain;
  margin: 0 calc(var(--s6) * -1); padding: var(--s2) var(--s6) calc(var(--bar-h, 56px) + var(--s5));
  border-top: 1px solid var(--line);
  /* A shade at an edge with more of the table: overlay scrollbars hide on a Mac. */
  background:
    linear-gradient(to right, var(--bg) 40%, transparent) left / 32px 100% no-repeat local,
    linear-gradient(to left, var(--bg) 40%, transparent) right / 32px 100% no-repeat local,
    radial-gradient(farthest-side at 0 50%, var(--shadow), transparent) left / 14px 100% no-repeat scroll,
    radial-gradient(farthest-side at 100% 50%, var(--shadow), transparent) right / 14px 100% no-repeat scroll,
    var(--bg);
  cursor: grab;
}
.panning, .panning * { cursor: grabbing !important; user-select: none; }
.view-desk .sizer { position: relative; margin: 0 auto; }
.view-desk .plane {
  position: absolute; left: 0; top: 0; transform-origin: 0 0;
  display: flex; align-items: flex-start; gap: 0 var(--desk-gutter); width: max-content;
  padding: var(--s3) var(--s4) var(--s5);
  background-image: radial-gradient(var(--line-strong) 0.9px, transparent 1.1px);
  background-size: var(--s5) var(--s5);
}
.view-rack :is(.sizer, .plane) { display: contents; }
.view-desk .shelf { position: relative; z-index: 1; flex: none; width: max(var(--desk-col), var(--col-w, 0px)); margin-top: var(--s5); }
.view-desk.alt-claim .shelf { width: var(--desk-col); }
.view-desk .shelf-head h2 { white-space: normal; }
.view-desk .slots, .view-desk .slots[data-layout] { grid-template-columns: minmax(0, 1fr); max-width: none; }
.view-desk .card { cursor: default; }
.view-desk .card.wide { grid-column: auto; }
/* The top strip of a card is its handle: drag it to place the card. */
.view-desk .card .addr { cursor: grab; }
.view-desk .card.moving { z-index: 5; box-shadow: 0 16px 32px -14px var(--shadow); }
.view-desk .card.moving .addr { cursor: grabbing; }
/* On the desk the marks never float over a card: a lit card's link label sits
   where the overlay would be. The focused card shows them as a footer. */
.view-desk .card:not(.focused) .acts { display: none; }
.view-desk .card.focused .acts { position: static; display: flex; margin: 0 calc(var(--s2) * -1); padding: 0; border: 0; background: none; }
.view-desk .card.focused .act.reply-btn { margin-left: auto; }

/* Your layout: every card and section label sits where you (or the frozen
   rule) put it. Nothing reflows, so opening a card moves nothing else. */
.view-desk.free .plane { display: block; }
.view-desk.free :is(.shelf, .slots) { display: contents; }
.view-desk.free :is(.card, .shelf-top) { position: absolute; z-index: 1; margin: 0; }
.view-desk.free .shelf-top.stray { display: none; }
.view-desk .card.focused { z-index: 4; }
.view-desk.free .card.focused { z-index: 1000 !important; }
.view-desk.free .card.moving { z-index: 1001 !important; }
/* On your own layout the lines lie above the cards, faint where they cross one. */
.view-desk.free .wires { z-index: 1002; }
.wires mask .all { fill: var(--mask-show); }
.wires mask .hole { fill: var(--mask-faint); }

/* Lines. Each link type has its own color and end; focus thickens a card's
   lines and fades the rest, so the type stays readable when it matters. */
.wires { position: absolute; left: 0; top: 0; z-index: 0; overflow: visible; pointer-events: none; }
.view-rack .wires { display: none; }
.wire { --wire: var(--fg-3); transition: opacity var(--fast) var(--ease); }
/* Line widths hold on screen at any zoom (the end shapes are resized in board.js). */
.wire .ln { fill: none; stroke: var(--wire); stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.wire .tip { fill: var(--wire); stroke: var(--wire); stroke-width: 1.25; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.wire.w-from .tip { fill: none; stroke-linecap: round; }
.wire.w-needs { --wire: var(--danger); }
.wire.w-needs .ln { stroke-width: 1.75; }
.wire.w-option { --wire: var(--link-option); }
.wire.w-option .tip { fill: var(--bg); }
.wire.w-mentions .ln { stroke-dasharray: 4 3; stroke-linecap: butt; } /* the same dash as a weak arrow in a flow figure */
.wire.w-mentions .tip { stroke: none; }
.board.focusing .wires .wire:not(.on) { opacity: 0.22; }
.wire.hot .ln { stroke-width: 2; }
.wire.on .ln { stroke-width: 2.25; }
.wire.on.w-needs .ln { stroke-width: 2.5; }

/* ---------- the chat with the agent: a box in the bottom-right corner ---------- */

/* Your messages are blue (your own act); the agent's are card stock; a
   revision is a quiet line between them. A new message from the agent puts
   a yellow-red dot on the closed box: it waits on you. */
.chat { position: fixed; right: var(--s4); bottom: var(--s4); z-index: 9; }
.chat-pill {
  display: inline-flex; align-items: center; gap: var(--s2); min-height: 34px; padding: 0 var(--s3);
  border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--surface);
  box-shadow: 0 10px 30px -12px var(--shadow); font-size: var(--t-s); color: var(--fg-2); cursor: pointer;
}
.chat-pill:hover { color: var(--fg); border-color: var(--fg-3); }
.chat-pill .dot { width: 8px; height: 8px; border-radius: var(--r-s); background: var(--signal); }
.chat.open { bottom: calc(var(--bar-h, 56px) + var(--s4) + var(--s2)); }
.chat-panel {
  display: flex; flex-direction: column; width: min(380px, calc(100vw - 2 * var(--s4)));
  height: min(460px, calc(100vh - var(--bar-h, 56px) - 96px));
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r);
  box-shadow: 0 16px 40px -16px var(--shadow);
}
.chat-head { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s3); border-bottom: 1px solid var(--line); font-size: var(--t-s); }
.chat-head span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--t-xs); color: var(--fg-3); }
.chat-head .btn { min-height: 28px; }
.chat-thread {
  flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: var(--s3);
  list-style: none; display: flex; flex-direction: column; gap: var(--s2);
}
.chat-thread .msg { max-width: 86%; padding: var(--s2) var(--s3); border-radius: var(--r); font-size: var(--t-s); line-height: 1.45; }
.chat-thread .msg p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.chat-thread .msg.you { align-self: flex-end; background: var(--accent-soft); }
.chat-thread .msg.agent { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); }
.chat-thread .meta { display: block; margin-top: 2px; font-size: var(--t-xs); color: var(--fg-3); }
.chat-thread .sys { align-self: center; max-width: 92%; text-align: center; font-size: var(--t-xs); color: var(--fg-3); }
.chat-thread .link { padding: 0; border: 0; background: none; color: var(--accent); font: inherit; font-weight: var(--w-strong); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.chat-compose { display: flex; align-items: flex-end; gap: var(--s2); padding: var(--s2) var(--s3) 0; border-top: 1px solid var(--line); }
.chat-compose textarea { min-height: 40px; max-height: 140px; resize: none; font-size: var(--t-s); }
.chat-hint { margin: 0; padding: var(--s1) var(--s3) var(--s2); font-size: var(--t-xs); color: var(--fg-3); }

/* Where the toolbar reaches the right corner, the closed box sits above it. */
@media (max-width: 1440px) {
  .chat { bottom: calc(var(--bar-h, 56px) + var(--s4) + var(--s2)); }
}
}

.empty { margin-top: var(--s6); color: var(--fg-2); }

/* ---------- toolbar ---------- */

.bar {
  position: fixed; left: 50%; bottom: var(--s4); transform: translateX(-50%); z-index: 10;
  display: flex; align-items: center; gap: var(--s2); max-width: calc(100vw - var(--s4));
  padding: 6px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r);
  box-shadow: 0 10px 30px -12px var(--shadow);
}
.bar .tools { display: flex; align-items: center; gap: var(--s2); min-width: 0; }
.seg { display: flex; gap: 2px; padding: 2px; background: var(--surface-2); border-radius: var(--r); }
.seg button {
  min-height: 30px; padding: 0 var(--s3); border: 0; border-radius: var(--r-in); background: none;
  font-size: var(--t-s); color: var(--fg-2); cursor: pointer; white-space: nowrap;
}
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: var(--w-strong); box-shadow: 0 0 0 1px var(--line); }
.seg .c { margin-left: var(--s1); color: var(--fg-3); font-weight: var(--w-regular); }
.seg button[data-filter="yours"] .c.hot { color: var(--signal-ink); background: var(--signal); border-radius: var(--r-s); padding: 0 4px; }
.bar .sep { width: 1px; align-self: stretch; margin: 4px 2px; background: var(--line); }
.bar select {
  min-height: 34px; padding: 0 var(--s2); border: 0; border-radius: var(--r); background: none;
  font-size: var(--t-s); color: var(--fg-2); cursor: pointer;
}
.bar select:hover { color: var(--fg); background: var(--surface-2); }
.search { display: flex; align-items: center; gap: var(--s1); }
.search input {
  width: 9.5rem; min-height: 34px; padding: 0 var(--s2); border: 1px solid transparent; border-radius: var(--r);
  background: var(--surface-2); font-size: var(--t-s);
}
.search input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.send {
  min-height: 34px; padding: 0 var(--s4); border: 0; border-radius: var(--r);
  background: var(--accent); color: var(--accent-fg); font-size: var(--t-s); font-weight: var(--w-strong); cursor: pointer; white-space: nowrap;
}
.send:disabled { background: var(--surface-2); color: var(--fg-3); cursor: default; }
.icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: var(--r); background: none; color: var(--fg-3); cursor: pointer; }
.icon-btn:hover { color: var(--fg); background: var(--surface-2); }

/* ---------- dialogs ---------- */

dialog {
  width: min(560px, calc(100vw - 2 * var(--s4))); padding: var(--s5); border: 1px solid var(--line-strong); border-radius: var(--r);
  background: var(--surface); color: var(--fg); box-shadow: 0 24px 60px -20px var(--shadow);
}
dialog::backdrop { background: oklch(0.2 0.01 260 / 0.25); }
dialog h2 { margin: 0 0 var(--s2); font-size: var(--t-l); font-weight: var(--w-strong); }
dialog p { margin: 0 0 var(--s3); color: var(--fg-2); font-size: var(--t-s); }
dialog textarea { min-height: 220px; font-family: var(--mono); font-size: var(--t-xs); }
dialog .row { display: flex; justify-content: flex-end; align-items: center; gap: var(--s2); margin-top: var(--s3); }
dialog .made { margin-right: auto; font-size: var(--t-xs); color: var(--fg-3); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: var(--s1) var(--s4); font-size: var(--t-s); margin: 0; }
.keys dt { font-family: var(--mono); color: var(--fg); }
.keys dd { margin: 0; color: var(--fg-2); }
.toast {
  position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 11;
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s2) var(--s3); border-radius: var(--r); background: var(--fg); color: var(--surface); font-size: var(--t-s);
}
.toast button { min-height: 28px; padding: 0 var(--s2); border: 1px solid currentColor; border-radius: var(--r-in); background: none; color: inherit; font-weight: var(--w-strong); cursor: pointer; }

/* ---------- small screens ---------- */

/* Narrow: the bar becomes two rows and hides nothing. Filters, the desk
   switch and Send on the first row, so Send is always in reach. Each row lays
   out on its own (flex with a forced break), so a wide control in one row
   cannot push Send off the screen; at worst Send wraps, still visible. */
@media (max-width: 900px) {
  html { scroll-padding-bottom: 150px; }
  .page { padding-bottom: 190px; }
  .bar {
    left: var(--s2); right: var(--s2); bottom: var(--s2); transform: none; max-width: 760px; margin: 0 auto;
    flex-wrap: wrap; gap: var(--s1) var(--s2);
  }
  .bar::before { content: ""; order: 4; flex-basis: 100%; height: 0; }
  .bar .tools { display: contents; }
  .bar .sep { display: none; }
  .bar .seg-filter { order: 1; }
  .bar .seg-view { order: 2; }
  .bar [data-act="help"] { order: 3; margin-left: auto; }
  .bar .send { order: 3; }
  .bar .seg-alt { order: 5; }
  .bar select { order: 6; max-width: 8.5rem; }
  .bar .search { order: 7; flex: 1 1 6rem; min-width: 0; }
  .bar .search input { width: 100%; min-width: 0; }
  .toast { bottom: 140px; }
}

@media (max-width: 720px) {
  /* The bar can take three rows here (Find wraps); keep content and toasts clear of it. */
  html { scroll-padding-bottom: 190px; }
  .page { padding: var(--s5) var(--s4) 230px; }
  .toast { bottom: 184px; }
  h1.title { font-size: var(--t-xl); }
  .slots, .slots[data-layout="compare"] { grid-template-columns: minmax(0, 1fr); }
  .bar .search .icon-btn { display: none; }
  .view-desk .shelves { margin: 0 calc(var(--s4) * -1); padding-left: var(--s4); padding-right: var(--s4); }
  /* On a phone the table needs the height; the lede stays on the rack. */
  .view-desk .lede { display: none; }
  .desk-bar .legend { gap: var(--s1) var(--s3); }
  /* Keys need a keyboard; on a phone the slot goes to the desk switch. */
  .bar [data-act="help"] { display: none; }
  .bar .send { margin-left: auto; }
}

/* Touch: every target reaches 44px. The bar and the card footer grow; the card body does not. */
@media (pointer: coarse) {
  .acts { position: static; display: flex; padding: 0; margin: 0 calc(var(--s2) * -1); border: 0; background: none; }
  /* A claim row is one line: number, claim, state. Its marks show when the row is opened;
     in the row they would take the whole width and leave the claim none. */
  .view-rack.alt-claim .card:not(.open) .acts { display: none; }
  .act.reply-btn { margin-left: auto; }
  .act, .seg button, .send, .icon-btn, .bar select, .search input, .btn, .rail-tab, .history summary { min-height: 44px; }
  .seg button { min-width: 44px; }
  .icon-btn, .grip { width: 44px; height: 44px; }
  .context button { min-width: 44px; min-height: 44px; }
  .history summary { display: flex; align-items: center; }
  .opt { padding-block: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
}

@media print {
  body { background: var(--surface); }
  .bar, .acts, .reply, .grip, .chat, .desk-bar { display: none !important; }
  .card { break-inside: avoid; }
}

/* ---------- in a frame on another page (?embed) ---------- */
/* One row of tools: how much shows, which view, and Send. The page around the
   board owns everything else, and the wheel goes on to it at the board's edge. */
.embed .bar :is(.seg-filter, .sep, [data-sort], .search, [data-act="help"]) { display: none; }
.embed .bar .tools { flex-wrap: nowrap; }
.embed, .embed body, .embed .view-desk .shelves { overscroll-behavior: auto; }
/* In a frame the tools are a strip along its lower edge, not a box that floats over a card. */
.embed .bar { left: 0; right: 0; bottom: 0; transform: none; max-width: none; flex-wrap: nowrap; justify-content: space-between; border-width: 1px 0 0; border-radius: 0; box-shadow: none; }
.embed .page { padding-bottom: calc(var(--bar-h, 56px) + var(--s5)); }
/* The page around the frame has the large title; this one is a board's name. */
.embed h1.title { font-size: var(--t-xl); }
/* The ask tabs stay in sight while the cards scroll under them, so an ask
   that goes on hold is seen to do so. */
.embed .view-rack > header { display: contents; }
.embed .view-rack .rail { position: sticky; top: 0; z-index: 6; padding-top: var(--s2); background: var(--bg); }
</style>

<!--
THESIS: A card is a signal you can point at: one claim, one ask at most, a
figure when the claim has a shape. Refused: style knobs and placement by the
agent; a rule lays out both the rack and the desk.
OWN-WORLD: Kanban signal cards on a steel rack; the desk lays them in section
columns on a dotted table, joined by lines in the one ink. Yellow-red tab only
where the agent waits on you; blue only for your marks and focus.
STORY: See whose turn it is, scan claims and figures, press D for the links,
answer the flagged asks, send one batch.
FIRST VIEWPORT: andon line, title, lede, then the andon rail: one signal tab
per open ask, each a jump; the toolbar floats at the bottom.
FORM: candidate #7 Toyota kanban; raises: patent sheets (numerals, figure
numbers, lead lines), pictograms, bamboo slips. pool 7, roll f3a39d30.
-->
