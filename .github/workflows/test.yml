name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # A package mirror that stalls must not hold a job for hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      # Each of these makes a missing tool a failure here, where locally the test would skip.
      CARDS_E2E: required
      CARDS_BROWSER: ${{ matrix.browser }}
      CARDS_EMACS: required
      CARDS_FONT: required
      CARDS_GIT: required
    steps:
      # The whole history, for the release tags: a test compares skill/ with the tag of its version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Emacs for org-lint; an open CJK font and fonttools for the font a Chinese board carries.
      # Every step here fetches from a mirror, and a mirror sometimes stalls on the runner (four
      # times on one day): each fetch has a time limit and a second try. The packages are kept
      # between runs as well: the font alone is 61 MB, and a second try does not help against
      # a mirror that is slow for one runner.
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-noble-emacs-nox-fonts-noto-cjk-v1
      - name: Emacs and a CJK font
        run: |
          mkdir -p ~/apt-archives/partial
          try() { timeout 6m "$@" || { sleep 15; timeout 6m "$@"; }; }
          try sudo apt-get -o Acquire::Retries=3 update
          try sudo apt-get -o Acquire::Retries=3 -o Dpkg::Lock::Timeout=120 -o Dir::Cache::archives="$HOME/apt-archives" install -y --no-install-recommends emacs-nox fonts-noto-cjk
          # apt wrote the packages as root; the cache step reads them as this user.
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          ls ~/apt-archives | grep -c '\.deb$'
      - name: fonttools
        run: timeout 4m pipx install "fonttools[woff]" || { sleep 15; timeout 4m pipx install "fonttools[woff]"; }
      - name: Playwright
        run: timeout 4m npm install --no-save playwright@1.62.1 || { sleep 15; timeout 4m npm install --no-save playwright@1.62.1; }
      - name: The browser
        run: timeout 8m npx playwright install --with-deps ${{ matrix.browser }} || { sleep 15; timeout 8m npx playwright install --with-deps ${{ matrix.browser }}; }
      - run: npm test
