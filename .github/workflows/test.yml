name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # A package mirror that stalls must not hold a job for hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      # Each of these makes a missing tool a failure here, where locally the test would skip.
      CARDS_E2E: required
      CARDS_BROWSER: ${{ matrix.browser }}
      CARDS_EMACS: required
      CARDS_FONT: required
      CARDS_GIT: required
    steps:
      # The whole history, for the release tags: a test compares skill/ with the tag of its version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Emacs for org-lint; an open CJK font and fonttools for the font a Chinese board carries.
      - run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 -o Dpkg::Lock::Timeout=120 install -y --no-install-recommends emacs-nox fonts-noto-cjk
      - run: pipx install "fonttools[woff]"
      - run: npm install --no-save playwright@1.62.1
      # The download of a browser, or of the packages it needs, sometimes stalls on the runner
      # (twice on one day here): a time limit, and a second try.
      - run: timeout 8m npx playwright install --with-deps ${{ matrix.browser }} || timeout 8m npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm test
