<!--
THESIS: A card is a signal you can point at: one claim, at most one ask. The
board refuses the canvas: no drawn edges, no free placement, no style knobs.
OWN-WORLD: Kanban signal cards on a steel rack. Card stock on cool steel, one
printed ink, a JIS yellow-red tab only where the agent waits on you, JIS blue
only for your own marks and focus. Numerals are addresses, never decoration.
STORY: You see whose turn it is, scan the claims, answer the few flagged
asks, mark the rest Keep, Drop or More, and send one batch back.
FIRST VIEWPORT: the andon line and title, the lede, then the andon rail: one
real signal tab per open ask, each a jump; the toolbar floats at the bottom.
FORM: candidate #7 Toyota kanban, fused; raises from patent sheets, pictogram
program, bamboo slips. pool 7, roll f3a39d30.
-->
<div id="app"></div>
<noscript><p class="noscript">This board needs JavaScript. Its source is the board.md file next to it.</p></noscript>
<script type="application/json" id="board-data">{{data}}</script>
<script>{{digest}}</script>
<script>{{js}}</script>
</body>
</html>
